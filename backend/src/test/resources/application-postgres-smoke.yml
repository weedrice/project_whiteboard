spring:
  datasource:
    url: ${POSTGRES_SMOKE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/noviis_ci_app}
    username: ${POSTGRES_SMOKE_DATASOURCE_USERNAME:noviis_ci}
    password: ${POSTGRES_SMOKE_DATASOURCE_PASSWORD:noviis_ci}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
