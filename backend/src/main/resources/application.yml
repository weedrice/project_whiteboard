spring:
  application:
    name: noviis
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # 환경 변수로 제어, 기본값: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    postgresql:
      transactional-lock: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # Batch Fetch Size 설정 (N+1 쿼리 최적화)
        # 컬렉션을 조회할 때 한 번에 여러 개를 가져옵니다
        jdbc:
          batch_size: 50
        # @BatchSize 어노테이션과 함께 사용
        # 예: @BatchSize(size = 50)을 @OneToMany 컬렉션에 적용
        order_inserts: true
        order_updates: true
  # spring.messages.* 는 의도적으로 두지 않는다. MessageConfig가 `messageSource` 빈을
  # 직접 정의해 Boot 자동설정이 물러나므로 이 위치의 값은 적용되지 않는다.
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      pool:
        size: 4
  cache:
    type: caffeine
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}

app:
  thumbnail:
    allowed-external-hosts: ${APP_THUMBNAIL_ALLOWED_EXTERNAL_HOSTS:}
  cache:
    read-optimization-enabled: ${APP_CACHE_READ_OPTIMIZATION_ENABLED:false}
  shop-stream:
    redis:
      enabled: ${APP_SHOP_STREAM_REDIS_ENABLED:false}
      channel: ${APP_SHOP_STREAM_REDIS_CHANNEL:noviis:shop:sale-status}
      instance-id: ${APP_INSTANCE_ID:${random.uuid}}
  error-log:
    client-retention-days: ${APP_ERROR_LOG_CLIENT_RETENTION_DAYS:30}
    resolved-retention-days: ${APP_ERROR_LOG_RESOLVED_RETENTION_DAYS:90}
    cleanup-batch-size: ${APP_ERROR_LOG_CLEANUP_BATCH_SIZE:500}
  message-queue:
    terminal-retention-days: ${APP_MESSAGE_QUEUE_TERMINAL_RETENTION_DAYS:30}
    delivered-unconfirmed-retention-days: ${APP_MESSAGE_QUEUE_DELIVERED_UNCONFIRMED_RETENTION_DAYS:7}
    cleanup-batch-size: ${APP_MESSAGE_QUEUE_CLEANUP_BATCH_SIZE:500}
  verification-code:
    terminal-retention-days: ${APP_VERIFICATION_CODE_TERMINAL_RETENTION_DAYS:7}
    pending-recovery-grace-minutes: ${APP_VERIFICATION_CODE_PENDING_RECOVERY_GRACE_MINUTES:30}
    pending-recovery-batch-size: ${APP_VERIFICATION_CODE_PENDING_RECOVERY_BATCH_SIZE:500}
    pending-recovery-max-batches: ${APP_VERIFICATION_CODE_PENDING_RECOVERY_MAX_BATCHES:10}
    password-reset-token-retention-days: ${APP_PASSWORD_RESET_TOKEN_RETENTION_DAYS:30}
    password-reset-token-cleanup-batch-size: ${APP_PASSWORD_RESET_TOKEN_CLEANUP_BATCH_SIZE:500}
    cleanup-batch-size: ${APP_VERIFICATION_CODE_CLEANUP_BATCH_SIZE:500}
  agent:
    pending-claim-hard-delete-days: ${APP_AGENT_PENDING_CLAIM_HARD_DELETE_DAYS:7}
    pending-claim-purge-batch-size: ${APP_AGENT_PENDING_CLAIM_PURGE_BATCH_SIZE:500}
    pending-claim-purge-max-batches: ${APP_AGENT_PENDING_CLAIM_PURGE_MAX_BATCHES:10}

server:
  shutdown: graceful

management:
  health:
    redis:
      # The relay is best-effort. Redis loss must not make the core API unhealthy.
      enabled: false
  server:
    address: 127.0.0.1
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

# SpringDoc OpenAPI (Swagger) 설정
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
    # 프로덕션 환경에서는 비활성화하려면 application-prod.yml에서 override

# Rate Limiting 설정
rate-limit:
  enabled: true
  # 인증 엔드포인트 제한 (무차별 대입 공격 방지)
  auth-limit: 5
  # 에이전트 등록 전용 IP 제한
  agent-register-limit: 5
  # 비인증 로그 수집 엔드포인트 제한
  public-log-limit: 10
  # 계정별 로그인 실패 제한
  auth-account-limit: 5
  # 일반 API 엔드포인트 제한
  api-limit: 200
  # 인증된 사용자 제한
  user-limit: 500

semantic-search:
  related-post:
    min-similarity: ${SEMANTIC_SEARCH_RELATED_POST_MIN_SIMILARITY:0.55}
