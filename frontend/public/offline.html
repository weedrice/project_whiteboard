<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoviIs Offline</title>
    <style>
      body {
        align-items: center;
        background: #f7f8fb;
        color: #20242c;
        display: flex;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        min-height: 100vh;
        margin: 0;
        justify-content: center;
        padding: 24px;
      }
      main {
        max-width: 420px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 12px;
      }
      p {
        line-height: 1.6;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>오프라인 상태입니다</h1>
      <p>네트워크 연결을 확인한 뒤 다시 시도해 주세요.</p>
    </main>
  </body>
</html>
