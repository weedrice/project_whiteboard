<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoviIs Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f8fb;
        --panel: #ffffff;
        --text: #20242c;
        --muted: #667085;
        --border: #e3e7ee;
        --accent: #2563eb;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101318;
          --panel: #171b22;
          --text: #f1f5f9;
          --muted: #a0a8b5;
          --border: #2c3340;
          --accent: #7aa2ff;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: var(--bg);
        color: var(--text);
        display: flex;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        max-width: 420px;
        padding: 24px;
      }

      h1 {
        font-size: 24px;
        line-height: 1.25;
        margin: 0 0 12px;
      }

      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 18px;
      }

      a {
        color: var(--accent);
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible,
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="offline-title">오프라인 상태입니다</h1>
      <p id="offline-description">네트워크 연결을 확인한 뒤 다시 시도해주세요. 이미 방문한 일부 화면은 계속 열릴 수 있습니다.</p>
      <a id="offline-home" href="/">홈으로 돌아가기</a>
    </main>
    <script>
      const offlineMessages = {
        ko: {
          title: '오프라인 상태입니다',
          description: '네트워크 연결을 확인한 뒤 다시 시도해주세요. 이미 방문한 일부 화면은 계속 열릴 수 있습니다.',
          home: '홈으로 돌아가기',
        },
        en: {
          title: 'You are offline',
          description: 'Check your network connection and try again. Some pages you already visited may remain available.',
          home: 'Return home',
        },
      }
      const offlineLocale = navigator.language?.toLowerCase().startsWith('en') ? 'en' : 'ko'
      const offlineCopy = offlineMessages[offlineLocale]
      document.documentElement.lang = offlineLocale
      document.getElementById('offline-title').textContent = offlineCopy.title
      document.getElementById('offline-description').textContent = offlineCopy.description
      document.getElementById('offline-home').textContent = offlineCopy.home
    </script>
  </body>
</html>
