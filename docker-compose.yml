name: noviis

services:
  postgres:
    image: postgres:16-alpine
    container_name: noviis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noviis}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    image: noviis-backend:local
    container_name: noviis-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-noviis}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      JWT_SECRET_DEV: ${JWT_SECRET_DEV:?Set JWT_SECRET_DEV to a Base64-encoded HS256 key}
      MY_ACCESS_KEY: ${MY_ACCESS_KEY:-local}
      MY_SECRET_KEY: ${MY_SECRET_KEY:-local}
      AWS_SES_ACCESS_KEY: ${AWS_SES_ACCESS_KEY:-local}
      AWS_SES_SECRET_KEY: ${AWS_SES_SECRET_KEY:-local}
      AWS_SES_SENDER: ${AWS_SES_SENDER:-noreply@localhost}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_BUCKET: ${S3_BUCKET:-noviis-local}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-localhost}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-noreply@localhost}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-local}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./logs/backend:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_INQUIRY_BOARD_URL: ${VITE_INQUIRY_BOARD_URL:-inquiry}
        VITE_COMMIT_HASH: ${VITE_COMMIT_HASH:-docker}
    image: noviis-frontend:local
    container_name: noviis-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres-data:
