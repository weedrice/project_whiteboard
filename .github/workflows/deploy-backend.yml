name: Deploy Backend

on:
  workflow_call:
    outputs:
      activated_sha:
        description: Commit SHA verified on the backend management endpoint
        value: ${{ jobs.deploy.outputs.activated_sha }}
    inputs:
      expected_sha:
        required: true
        type: string
      release_artifact_name:
        required: true
        type: string
      backup_snapshot_id:
        required: false
        type: string
        default: ''
      contract_migration:
        required: false
        type: boolean
        default: false
    secrets:
      EC2_HOST:
        required: true
      EC2_SSH_KEY:
        required: true
      EC2_HOST_FINGERPRINT:
        required: true
      AWS_CONTRACT_EVIDENCE_ROLE_ARN:
        required: false
      AWS_REGION:
        required: false
      RDS_PRODUCTION_DB_IDENTIFIER:
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  attestations: read
  id-token: write

jobs:
  deploy:
    outputs:
      activated_sha: ${{ steps.activation-result.outputs.activated_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout expected commit
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Download verified backend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.release_artifact_name }}
          path: release-artifact

      - name: Verify backend artifact checksum and metadata
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          BACKUP_SNAPSHOT_ID: ${{ inputs.backup_snapshot_id }}
        run: |
          set -euo pipefail
          (cd release-artifact && sha256sum --strict --check SHA256SUMS)
          grep -Fqx -- "commit_sha=$EXPECTED_SHA" release-artifact/RELEASE_METADATA
          if [ -n "$BACKUP_SNAPSHOT_ID" ]; then
            grep -Fqx -- "backup_snapshot_id=$BACKUP_SNAPSHOT_ID" release-artifact/RELEASE_METADATA
          fi

      - name: Verify backend GitHub artifact attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify release-artifact/app.jar --repo "$GITHUB_REPOSITORY" --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-ref refs/heads/main --source-digest "${{ inputs.expected_sha }}" --deny-self-hosted-runners
          gh attestation verify release-artifact/app.jar --repo "$GITHUB_REPOSITORY" --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-ref refs/heads/main --source-digest "${{ inputs.expected_sha }}" --predicate-type https://spdx.dev/Document/v2.3 --deny-self-hosted-runners

      - name: Configure read-only AWS credentials for contract evidence
        if: inputs.contract_migration
        uses: aws-actions/configure-aws-credentials@56d6a583f00f6bad6d19d91d53a7bc3b8143d0e9 # v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_CONTRACT_EVIDENCE_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: noviis-contract-evidence-${{ github.run_id }}

      - name: Verify contract migration snapshot evidence
        if: inputs.contract_migration
        env:
          SNAPSHOT_ID: ${{ inputs.backup_snapshot_id }}
          PRODUCTION_DB_IDENTIFIER: ${{ secrets.RDS_PRODUCTION_DB_IDENTIFIER }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: bash backend/scripts/verify-contract-deployment-evidence.sh "$SNAPSHOT_ID" "$PRODUCTION_DB_IDENTIFIER" "$EXPECTED_SHA"

      - name: Prepare backend release directory
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: noviis-deploy
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          script: |
            set -eu
            test "$(sha256sum /usr/local/sbin/activate-noviis-backend | awk '{print $1}')" = "${{ hashFiles('deploy/scripts/activate-backend-release.sh') }}"
            test "$(sha256sum /usr/local/sbin/verify-noviis-release | awk '{print $1}')" = "${{ hashFiles('deploy/scripts/verify-release-provenance.sh') }}"
            test "$(sha256sum /etc/systemd/system/app.service | awk '{print $1}')" = "${{ hashFiles('deploy/systemd/app.service') }}"
            RELEASE_DIR="/opt/app/backend/incoming/${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            test ! -e "$RELEASE_DIR"
            install -d -m 0755 "$RELEASE_DIR"

      - name: Upload verified backend artifact
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: noviis-deploy
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          source: "release-artifact/app.jar,release-artifact/SHA256SUMS,release-artifact/RELEASE_METADATA,release-artifact/sbom.spdx.json,release-artifact/PROVENANCE_BUNDLE.jsonl"
          target: "/opt/app/backend/incoming/${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          strip_components: 1

      - name: Reject a stale deployment immediately before activation
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"

      - name: Activate backend release
        id: activate
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: noviis-deploy
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          capture_stdout: true
          script: |
            set -eu
            RELEASE_DIR="/opt/app/backend/incoming/${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            sudo /usr/local/sbin/activate-noviis-backend "$RELEASE_DIR" "${{ inputs.expected_sha }}"

      - name: Record verified backend activation
        id: activation-result
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTIVATION_STDOUT: ${{ steps.activate.outputs.stdout }}
        run: |
          set -euo pipefail
          activated_sha="$(printf '%s\n' "$ACTIVATION_STDOUT" | sed -n 's/^ACTIVATED_SHA=//p' | tail -n 1)"
          test "$activated_sha" = "$EXPECTED_SHA"
          echo "activated_sha=$activated_sha" >> "$GITHUB_OUTPUT"

      - name: Clean backend incoming release
        id: cleanup
        if: always()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: noviis-deploy
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          script: |
            set -eu
            RELEASE_DIR="/opt/app/backend/incoming/${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            if [ -e "$RELEASE_DIR" ]; then
              case "$(realpath "$RELEASE_DIR")/" in /opt/app/backend/incoming/*/) rm -rf -- "$RELEASE_DIR" ;; *) exit 1 ;; esac
            fi
        continue-on-error: true

      - name: Report backend cleanup debt
        if: always() && steps.cleanup.outcome == 'failure'
        run: |
          echo "::warning title=Backend cleanup debt::The verified backend release remains active; incoming cleanup requires operator follow-up."
          echo "Backend incoming cleanup failed after activation of ${{ inputs.expected_sha }}." >> "$GITHUB_STEP_SUMMARY"
