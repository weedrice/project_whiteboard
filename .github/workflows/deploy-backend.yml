name: Deploy Backend

on:
  workflow_call:
    outputs:
      activated_sha:
        description: Commit SHA verified on the backend management endpoint
        value: ${{ jobs.deploy.outputs.activated_sha }}
    inputs:
      expected_sha:
        required: true
        type: string
      release_artifact_id:
        required: true
        type: string
      release_metadata_attempt:
        required: true
        type: string
      contract_migration:
        required: false
        type: boolean
        default: false
    secrets:
      EC2_HOST:
        required: true
      EC2_SSH_KEY:
        required: true
      EC2_USER:
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false
  queue: single

permissions:
  contents: read
  attestations: read

jobs:
  deploy:
    outputs:
      activated_sha: ${{ steps.activation-result.outputs.activated_sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      attestations: read

    steps:
      - name: Checkout expected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate backend release identity
        env:
          RELEASE_ARTIFACT_ID: ${{ inputs.release_artifact_id }}
          RELEASE_METADATA_ATTEMPT: ${{ inputs.release_metadata_attempt }}
        run: |
          [[ "$RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_METADATA_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

      - name: Download verified backend artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.release_artifact_id }}
          path: release-artifact

      - name: Verify backend artifact checksum and metadata
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONTRACT_MIGRATION: ${{ inputs.contract_migration }}
          RELEASE_METADATA_ATTEMPT: ${{ inputs.release_metadata_attempt }}
        run: |
          set -euo pipefail
          (cd release-artifact && sha256sum --strict --check SHA256SUMS)
          grep -Fqx -- "commit_sha=$EXPECTED_SHA" release-artifact/RELEASE_METADATA
          grep -Fqx -- "repository=$GITHUB_REPOSITORY" release-artifact/RELEASE_METADATA
          grep -Fqx -- "run_id=$GITHUB_RUN_ID" release-artifact/RELEASE_METADATA
          grep -Fqx -- "run_number=$GITHUB_RUN_NUMBER" release-artifact/RELEASE_METADATA
          grep -Fqx -- "run_attempt=$RELEASE_METADATA_ATTEMPT" release-artifact/RELEASE_METADATA
          grep -Fqx -- "contract_migration=$CONTRACT_MIGRATION" release-artifact/RELEASE_METADATA

      - name: Verify backend GitHub artifact attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify release-artifact/RELEASE_ENVELOPE --repo "$GITHUB_REPOSITORY" --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-ref refs/heads/main --source-digest "${{ inputs.expected_sha }}" --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners
          gh attestation verify release-artifact/app.jar --repo "$GITHUB_REPOSITORY" --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-ref refs/heads/main --source-digest "${{ inputs.expected_sha }}" --predicate-type https://spdx.dev/Document/v2.3 --deny-self-hosted-runners

      - name: Prepare backend staging directory
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            STAGING_DIR="/tmp/noviis-backend-${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            case "$STAGING_DIR" in /tmp/noviis-backend-*) ;; *) exit 64 ;; esac
            test ! -e "$STAGING_DIR"
            install -d -m 0700 "$STAGING_DIR"

      - name: Upload verified backend artifact
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "release-artifact/app.jar,release-artifact/SHA256SUMS,release-artifact/RELEASE_METADATA,release-artifact/sbom.spdx.json,release-artifact/RELEASE_ENVELOPE,release-artifact/PROVENANCE_BUNDLE.jsonl"
          target: "/tmp/noviis-backend-${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          strip_components: 1

      - name: Reject a stale deployment immediately before activation
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          bash deploy/scripts/verify-deployment-freshness.sh "$EXPECTED_SHA" "$(git rev-parse origin/main)" backend

      - name: Activate backend release
        id: activate
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          capture_stdout: false
          script: |
            set -eu
            EXPECTED_SHA="${{ inputs.expected_sha }}"
            CONTRACT_MIGRATION="${{ inputs.contract_migration }}"
            STAGING_DIR="/tmp/noviis-backend-${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            APP_DIR="/opt/app/backend"
            HEALTH_URL="http://127.0.0.1:8081/actuator/health"

            case "$STAGING_DIR" in /tmp/noviis-backend-*) ;; *) exit 64 ;; esac
            [ "$CONTRACT_MIGRATION" = true ] || [ "$CONTRACT_MIGRATION" = false ]
            (cd "$STAGING_DIR" && sha256sum --strict --check SHA256SUMS)
            grep -Fqx -- "commit_sha=$EXPECTED_SHA" "$STAGING_DIR/RELEASE_METADATA"
            expected_digest="$(awk '$2 == "app.jar" { print $1 }' "$STAGING_DIR/SHA256SUMS")"
            echo "$expected_digest" | grep -Eq '^[0-9a-f]{64}$'

            sudo install -d -m 0755 "$APP_DIR"
            sudo install -m 0644 "$STAGING_DIR/app.jar" "$APP_DIR/app.jar.next"
            test "$(sudo sha256sum "$APP_DIR/app.jar.next" | awk '{print $1}')" = "$expected_digest"
            sudo systemctl daemon-reload

            had_previous=false
            previous_digest=''
            if sudo test -f "$APP_DIR/app.jar"; then
              previous_digest="$(sudo sha256sum "$APP_DIR/app.jar" | awk '{print $1}')"
              sudo install -m 0644 "$APP_DIR/app.jar" "$APP_DIR/app.jar.rollback"
              test "$(sudo sha256sum "$APP_DIR/app.jar.rollback" | awk '{print $1}')" = "$previous_digest"
              had_previous=true
            fi

            stop_attempted=false
            replacement_attempted=false
            start_attempted=false
            activation_phase=stop

            report_backend_state() {
              # Only fixed service state fields; never print journal, unit or environment contents.
              sudo systemctl show app \
                --property=ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,NRestarts,MainPID \
                >&2 2>/dev/null || echo "Backend service state diagnostics unavailable" >&2
            }

            stop_and_confirm() {
              sudo systemctl stop app || return 1
              test "$(sudo systemctl show app --property=MainPID --value)" = 0 || return 1
              if sudo systemctl is-active --quiet app; then
                echo "Backend is still active after stop; refusing JAR replacement" >&2
                return 1
              fi
            }

            wait_for_backend() {
              attempt=0
              readiness_failure=health_unavailable
              while [ "$attempt" -lt 45 ]; do
                readiness_failure=health_unavailable
                if curl -fsS --max-time 5 "$HEALTH_URL" >/dev/null 2>&1; then
                  readiness_failure=runtime_identity_unverified
                  if [ -z "$1" ] || curl -fsS --max-time 5 "${HEALTH_URL%/health}/info" \
                    2>/dev/null | grep -Fq -- "\"commit\":\"$1\""; then
                    return 0
                  fi
                fi
                attempt=$((attempt + 1))
                sleep 2
              done
              echo "Backend readiness failed: $readiness_failure after $attempt probes" >&2
              return 1
            }

            recover_backend() {
              [ "$stop_attempted" = true ] || return 0
              if [ "$replacement_attempted" != true ] && sudo systemctl is-active --quiet app; then
                echo "Previous backend is still active; leaving it unchanged" >&2
                return 0
              fi
              stop_and_confirm || return 1
              if [ "$CONTRACT_MIGRATION" = true ] && [ "$start_attempted" = true ]; then
                echo "Contract backend start was attempted; leaving the new JAR stopped for operator recovery" >&2
                return 0
              fi
              if [ "$had_previous" != true ]; then
                echo "No previous backend JAR is available; operator recovery is required" >&2
                return 0
              fi
              test "$(sudo sha256sum "$APP_DIR/app.jar.rollback" | awk '{print $1}')" = "$previous_digest" || return 1
              sudo install -m 0644 "$APP_DIR/app.jar.rollback" "$APP_DIR/app.jar" || return 1
              test "$(sudo sha256sum "$APP_DIR/app.jar" | awk '{print $1}')" = "$previous_digest" || return 1
              sudo systemctl start app || return 1
              wait_for_backend "" || return 1
              echo "Previous backend restored and healthy" >&2
            }

            on_exit() {
              status=$?
              trap - EXIT INT TERM HUP
              if [ "$status" -ne 0 ]; then
                echo "Backend activation failed: phase=$activation_phase exit=$status; checking recovery state" >&2
                report_backend_state
                if ! recover_backend; then
                  echo "Backend recovery failed; operator recovery is required" >&2
                fi
              fi
              exit "$status"
            }
            trap on_exit EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM
            trap 'exit 129' HUP

            stop_attempted=true
            stop_and_confirm
            activation_phase=replace
            replacement_attempted=true
            sudo mv "$APP_DIR/app.jar.next" "$APP_DIR/app.jar"
            activation_phase=start
            start_attempted=true
            sudo systemctl start app
            activation_phase=readiness
            wait_for_backend "$EXPECTED_SHA"

            activation_phase=integrity
            test "$(sudo sha256sum "$APP_DIR/app.jar" | awk '{print $1}')" = "$expected_digest"
            echo "ACTIVATED_SHA=$EXPECTED_SHA"
            echo "ACTIVATED_RUN_ID=${{ github.run_id }}"
            echo "ACTIVATED_RUN_NUMBER=${{ github.run_number }}"
            echo "ACTIVATED_RUN_ATTEMPT=${{ github.run_attempt }}"

      - name: Reconcile backend activation from independent readback
        id: reconcile
        if: always()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          capture_stdout: false
          script: |
            set -eu
            EXPECTED_SHA="${{ inputs.expected_sha }}"
            STAGING_DIR="/tmp/noviis-backend-${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            readback_phase=artifact
            trap 'status=$?; if [ "$status" -ne 0 ]; then echo "Backend readback failed: phase=$readback_phase exit=$status" >&2; fi; exit "$status"' EXIT
            (cd "$STAGING_DIR" && sha256sum --strict --check SHA256SUMS)
            grep -Fqx -- "commit_sha=$EXPECTED_SHA" "$STAGING_DIR/RELEASE_METADATA"
            grep -Fqx -- "run_id=${{ github.run_id }}" "$STAGING_DIR/RELEASE_METADATA"
            grep -Fqx -- "run_number=${{ github.run_number }}" "$STAGING_DIR/RELEASE_METADATA"
            grep -Fqx -- "run_attempt=${{ inputs.release_metadata_attempt }}" "$STAGING_DIR/RELEASE_METADATA"
            expected_digest="$(awk '$2 == "app.jar" { print $1 }' "$STAGING_DIR/SHA256SUMS")"
            readback_phase=installed_digest
            test "$(sudo sha256sum /opt/app/backend/app.jar | awk '{print $1}')" = "$expected_digest"
            readback_phase=service
            sudo systemctl is-active --quiet app
            readback_phase=health
            curl -fsS --max-time 10 http://127.0.0.1:8081/actuator/health >/dev/null
            readback_phase=runtime_identity
            curl -fsS --max-time 10 http://127.0.0.1:8081/actuator/info \
              | grep -Fq -- "\"commit\":\"$EXPECTED_SHA\""
            echo "ACTIVATED_SHA=$EXPECTED_SHA"
            echo "ACTIVATED_RUN_ID=${{ github.run_id }}"
            echo "ACTIVATED_RUN_NUMBER=${{ github.run_number }}"
            echo "ACTIVATED_RUN_ATTEMPT=${{ github.run_attempt }}"

      - name: Record verified backend activation
        id: activation-result
        if: always()
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RECONCILIATION_OUTCOME: ${{ steps.reconcile.outcome }}
        run: |
          set -euo pipefail
          test "$RECONCILIATION_OUTCOME" = success
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Reconcile verifies artifact identity and the running SHA over an independent SSH connection.
          # Trust its exit status instead of ssh-action's unterminated stdout output on failure.
          echo "activated_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Clean backend staging directory
        if: always()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            STAGING_DIR="/tmp/noviis-backend-${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            case "$STAGING_DIR" in /tmp/noviis-backend-*) ;; *) exit 64 ;; esac
            if [ -e "$STAGING_DIR" ]; then
              rm -rf -- "$STAGING_DIR"
            fi
