name: Deploy Backend

on:
  workflow_call:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: backend

      - name: Build Spring Boot JAR
        run: ./gradlew clean bootJar
        working-directory: backend

      - name: Prepare backend release directory
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            RELEASE_DIR="/opt/app/backend/releases/${{ github.sha }}-${{ github.run_id }}"
            mkdir -p "$RELEASE_DIR"

      - name: Upload backend jar to release
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/build/libs/*.jar"
          target: "/opt/app/backend/releases/${{ github.sha }}-${{ github.run_id }}"
          strip_components: 3

      - name: Upload backend activation script
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/scripts/activate-backend-release.sh"
          target: "/opt/app/backend/releases/${{ github.sha }}-${{ github.run_id }}"
          strip_components: 2

      - name: Activate backend release
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            chmod 0755 "/opt/app/backend/releases/${{ github.sha }}-${{ github.run_id }}/activate-backend-release.sh"
            "/opt/app/backend/releases/${{ github.sha }}-${{ github.run_id }}/activate-backend-release.sh" \
              "/opt/app/backend/releases/${{ github.sha }}-${{ github.run_id }}"
