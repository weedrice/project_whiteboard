name: Deploy Backend

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: backend

      - name: Run tests
        run: ./gradlew test
        working-directory: backend

      - name: Generate test coverage report
        run: ./gradlew jacocoTestReport
        working-directory: backend

      - name: Verify test coverage
        run: ./gradlew jacocoTestCoverageVerification
        working-directory: backend

      - name: Build Spring Boot JAR
        run: ./gradlew clean bootJar
        working-directory: backend

      - name: Prepare backend release directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            RELEASE_DIR="/opt/app/backend/releases/${{ github.sha }}"
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"

      - name: Upload backend jar to release
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/build/libs/*.jar"
          target: "/opt/app/backend/releases/${{ github.sha }}"
          strip_components: 3

      - name: Activate backend release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            APP_DIR="/opt/app/backend"
            RELEASE_DIR="$APP_DIR/releases/${{ github.sha }}"
            NEXT_JAR="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.jar' | head -n 1)"
            test -n "$NEXT_JAR"
            test -d /opt/app/logs
            test -w /opt/app/logs
            sudo test -r /etc/noviis/app.env

            if [ -f "$APP_DIR/app.jar" ]; then
              sudo cp "$APP_DIR/app.jar" "$APP_DIR/app.jar.rollback"
            fi

            sudo install -m 0644 "$NEXT_JAR" "$APP_DIR/app.jar.next"
            sudo systemctl stop app || true
            sudo mv "$APP_DIR/app.jar.next" "$APP_DIR/app.jar"
            sudo systemctl daemon-reload

            if ! sudo systemctl start app; then
              sudo systemctl status app --no-pager || true
              sudo journalctl -u app -n 80 --no-pager || true
              sudo tail -n 120 /opt/app/logs/whiteboard-active.log || true
              sudo tail -n 120 /opt/app/logs/whiteboard-error.log || true
              if [ -f "$APP_DIR/app.jar.rollback" ]; then
                sudo cp "$APP_DIR/app.jar.rollback" "$APP_DIR/app.jar"
                sudo systemctl start app || true
              fi
              exit 1
            fi

            for i in $(seq 1 30); do
              if curl -fsS --max-time 3 http://127.0.0.1:8080/actuator/health >/dev/null; then
                sudo test -s /opt/app/logs/whiteboard-active.log
                sudo systemctl status app --no-pager
                find "$APP_DIR/releases" -mindepth 1 -maxdepth 1 -type d | sort | head -n -5 | xargs -r rm -rf
                exit 0
              fi
              sleep 2
            done

            echo "Backend health check failed after deploy"
            sudo systemctl status app --no-pager || true
            sudo journalctl -u app -n 80 --no-pager || true
            sudo tail -n 120 /opt/app/logs/whiteboard-active.log || true
            sudo tail -n 120 /opt/app/logs/whiteboard-error.log || true
            if [ -f "$APP_DIR/app.jar.rollback" ]; then
              sudo cp "$APP_DIR/app.jar.rollback" "$APP_DIR/app.jar"
              sudo systemctl restart app || true
            fi
            sudo systemctl status app --no-pager
            exit 1
