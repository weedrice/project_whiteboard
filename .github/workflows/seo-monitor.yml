name: SEO Monitor

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-monitor-production
  cancel-in-progress: false
  queue: max

jobs:
  seo-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require main for manual production SEO runs
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$GIT_REF" != refs/heads/main ]; then
            echo "Manual production SEO verification is allowed only from main" >&2
            exit 1
          fi

  verify-endpoints:
    needs: seo-preflight
    if: needs.seo-preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify SEO endpoints
        run: npm run seo:verify
        working-directory: frontend
        env:
          SEO_SITE_URL: https://noviis.kr
          SEO_SITEMAP_URL: https://noviis.kr/sitemap.xml
          SEO_VERIFY_MAX_URLS: 10
          SEO_VERIFY_TIMEOUT_MS: 15000
          SEO_VERIFY_ROTATION_SEED: ${{ github.run_id }}-${{ github.run_attempt }}
          SEO_REQUIRE_POST_URLS: "true"
          SEO_REQUIRE_RELEASE_MANIFEST: "true"
