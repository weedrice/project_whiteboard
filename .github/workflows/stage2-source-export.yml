name: Stage 2 Draft Event Validation

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simplify-draft-event-payload
          fetch-depth: 0
      - name: Apply compact event patches
        run: |
          base64 -d .github/stage2-pr177-6.patch.b64 > /tmp/stage2-pr177-6.patch
          base64 -d .github/stage2-pr177-7.patch.b64 > /tmp/stage2-pr177-7.patch
          for patch in .github/stage2-pr177-{1..5}.patch /tmp/stage2-pr177-6.patch /tmp/stage2-pr177-7.patch; do
            if git apply --check "$patch"; then
              git apply "$patch"
            elif git apply --reverse --check "$patch"; then
              echo "$patch already applied."
            else
              echo "$patch does not apply cleanly." >&2
              exit 1
            fi
          done
          sed -i 's/let localRevision = options.localRevision ?? 0/const localRevision = options.localRevision ?? 0/' frontend/src/features/board/posts/draft/__tests__/postDraftCrossTabReconciler.spec.ts
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/features/board/posts/draft/usePostDraft.ts')
          text = path.read_text()
          old = """        getSessionGeneration: () => sessionGeneration,
        getLocalRevision: () => localRevision,
        markCurrentRevisionPersisted: () => { persistedRevision = localRevision },
"""
          new = """        getSessionGeneration: () => sessionGeneration,
        getLocalRevision: () => localRevision,
        incrementLocalRevision: () => { localRevision++ },
        markCurrentRevisionPersisted: () => { persistedRevision = localRevision },
"""
          if old not in text:
              raise SystemExit('recovery revision anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint:ci
      - name: Type check
        working-directory: frontend
        run: npm run type-check
      - name: Draft contract tests
        working-directory: frontend
        run: npx vitest run src/composables/__tests__/usePostDraft.spec.ts src/features/board/posts/draft/__tests__/postDraftCrossTabReconciler.spec.ts src/features/board/posts/draft/__tests__/postDraftUpdatedEvent.spec.ts
      - name: Commit validated source
        run: |
          if git diff --quiet -- frontend; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git commit -m "refactor: shrink draft update event payload"
          git push origin HEAD:agent/simplify-draft-event-payload
