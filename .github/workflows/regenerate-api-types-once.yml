name: Regenerate API Types Once

on:
  push:
    branches:
      - agent/fix-generated-api-drift

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/fix-generated-api-drift
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Regenerate API types
        working-directory: frontend
        run: npm run api:generate

      - name: Commit generated API types
        run: |
          if git diff --quiet -- frontend/src/types/generated/api.ts; then
            echo "Generated API types are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/types/generated/api.ts
          git commit -m "Fix: 생성 API 타입 동기화"
          git push origin HEAD:agent/fix-generated-api-drift
