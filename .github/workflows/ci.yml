name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: backend

      - name: Run tests
        run: ./gradlew test jacocoTestCoverageVerification
        working-directory: backend

      - name: Upload test report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 30

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-coverage-report
          path: backend/build/reports/jacoco/html
          retention-days: 30

  frontend-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint:ci
        working-directory: frontend

      - name: Check i18n keys
        run: npm run check:i18n
        working-directory: frontend

      - name: Type check
        run: npm run type-check
        working-directory: frontend

      - name: Run tests with coverage
        run: npm run coverage
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Playwright E2E and accessibility tests
        run: npm run test:e2e:run
        working-directory: frontend

      - name: Upload test coverage
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 30

  backend-postgres-migration:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: noviis_ci
          POSTGRES_USER: noviis_ci
          POSTGRES_PASSWORD: noviis_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noviis_ci -d noviis_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply PostgreSQL migrations
        run: |
          set -euo pipefail
          for migration in $(find backend/src/main/resources/db/migration -name 'V*.sql' | sort -V); do
            echo "Applying ${migration}"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$migration"
          done
        env:
          DATABASE_URL: postgresql://noviis_ci:noviis_ci@localhost:5432/noviis_ci

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: backend

      - name: Create PostgreSQL app smoke database
        run: createdb -h localhost -U noviis_ci noviis_ci_app
        env:
          PGPASSWORD: noviis_ci

      - name: Run PostgreSQL application context smoke test
        run: ./gradlew test --tests "*PostgresApplicationContextSmokeTest" --rerun-tasks
        working-directory: backend
        env:
          POSTGRES_SMOKE_TEST: "true"
          POSTGRES_SMOKE_DATASOURCE_URL: jdbc:postgresql://localhost:5432/noviis_ci_app
          POSTGRES_SMOKE_DATASOURCE_USERNAME: noviis_ci
          POSTGRES_SMOKE_DATASOURCE_PASSWORD: noviis_ci

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - changes
      - backend-test
      - frontend-test
      - backend-postgres-migration
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend-test.result }}
          FRONTEND_RESULT: ${{ needs.frontend-test.result }}
          POSTGRES_RESULT: ${{ needs.backend-postgres-migration.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection failed: $CHANGES_RESULT"
            exit 1
          fi

          for result in "$BACKEND_RESULT" "$FRONTEND_RESULT" "$POSTGRES_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Required CI job failed or was cancelled: $result"
              exit 1
            fi
          done
