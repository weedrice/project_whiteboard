name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: Run the backend validation chain and deploy after the CI gate
        required: false
        type: boolean
        default: false
      deploy_frontend:
        description: Run the frontend validation chain and deploy after the CI gate
        required: false
        type: boolean
        default: false
      allow_contract_migration:
        description: Allow a reviewed contract migration during a manual main deployment
        required: false
        type: boolean
        default: false
      backup_snapshot_id:
        description: Identifier of the verified pre-contract production snapshot
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      ops: ${{ steps.scope.outputs.ops }}
      backend_changed: ${{ steps.filter.outputs.backend }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/nginx/**'
              - 'deploy/scripts/activate-backend-release.sh'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-backend.yml'
            frontend:
              - 'frontend/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-frontend.yml'
            ops:
              - 'deploy/**'
              - 'backend/scripts/**'
              - 'docker-compose*.yml'
              - 'backend/Dockerfile'
              - 'frontend/Dockerfile'
              - 'backend/gradle/wrapper/**'
              - '.github/workflows/**'
              - '.github/dependabot.yml'
              - 'docs/design-notes/**'
              - 'docs/ops/applied-contract-migrations.txt'
              - 'docs/ops/database-migration-policy.md'

      - name: Resolve validation scope
        id: scope
        env:
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
          OPS_CHANGED: ${{ steps.filter.outputs.ops }}
          MANUAL_BACKEND: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_backend || false }}
          MANUAL_FRONTEND: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_frontend || false }}
        run: |
          backend="$BACKEND_CHANGED"
          frontend="$FRONTEND_CHANGED"
          ops="$OPS_CHANGED"
          if [ "$MANUAL_BACKEND" = "true" ]; then backend=true; fi
          if [ "$MANUAL_FRONTEND" = "true" ]; then frontend=true; fi
          if [ "$MANUAL_BACKEND" = "true" ] || [ "$MANUAL_FRONTEND" = "true" ]; then ops=true; fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "ops=$ops" >> "$GITHUB_OUTPUT"

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: backend

      - name: Run tests
        run: ./gradlew test jacocoTestCoverageVerification
        working-directory: backend

      - name: Upload test report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 30

      - name: Upload coverage report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: backend-coverage-report
          path: backend/build/reports/jacoco/html
          retention-days: 30

      - name: Build backend container image
        run: |
          docker build --build-arg SKIP_TESTS=true --build-arg BUILD_COMMIT_SHA="$GITHUB_SHA" -t noviis-backend:ci backend
          test "$(docker image inspect --format '{{.Config.User}}' noviis-backend:ci)" = app
        working-directory: .

  frontend-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint:ci
        working-directory: frontend

      - name: Check i18n keys
        run: npm run check:i18n
        working-directory: frontend

      - name: Check UI conventions
        run: npm run check:ui
        working-directory: frontend

      - name: Type check
        run: npm run type-check
        working-directory: frontend

      - name: Run tests with coverage
        run: npm run coverage
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Playwright E2E and accessibility tests
        run: npm run test:e2e:run
        working-directory: frontend

      - name: Upload test coverage
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: frontend-playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 30

      - name: Build frontend container image
        run: |
          set -euo pipefail
          docker build -t noviis-frontend:ci frontend
          test "$(docker image inspect --format '{{.Config.User}}' noviis-frontend:ci)" = nginx
          network="noviis-frontend-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          backend_container="noviis-frontend-backend-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            docker rm -f "$backend_container" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$network" >/dev/null
          docker run -d --name "$backend_container" --network "$network" --network-alias backend \
            nginx:1.27.4-alpine@sha256:4ff102c5d78d254a6f0da062b3cf39eaf07f01eec0927fd21e219d0af8bc0591 >/dev/null
          docker run --rm --network "$network" --entrypoint nginx noviis-frontend:ci -t
        working-directory: .

  backend-postgres-migration:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      contract_migration: ${{ steps.migration_guard.outputs.contract_migration }}
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: noviis_ci
          POSTGRES_USER: noviis_ci
          POSTGRES_PASSWORD: noviis_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noviis_ci -d noviis_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check migration compatibility
        id: migration_guard
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before || 'HEAD^') }}
          VERIFY_CONTRACT_RUNS: "false"
        run: bash backend/scripts/check-migration-compatibility.sh "$BASE_REF" HEAD

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply PostgreSQL migrations
        run: |
          set -euo pipefail
          for migration in $(find backend/src/main/resources/db/migration -name 'V*.sql' | sort -V); do
            echo "Applying ${migration}"
            if [ -f "${migration}.conf" ] && grep -Fqx 'executeInTransaction=false' "${migration}.conf"; then
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
            else
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$migration"
            fi
          done
        env:
          DATABASE_URL: postgresql://noviis_ci:noviis_ci@localhost:5432/noviis_ci

      - name: Setup JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: backend

      - name: Create PostgreSQL app smoke database
        run: createdb -h localhost -U noviis_ci noviis_ci_app
        env:
          PGPASSWORD: noviis_ci

      - name: Run PostgreSQL application context smoke test
        run: ./gradlew test --tests "*PostgresApplicationContextSmokeTest" --rerun-tasks
        working-directory: backend
        env:
          POSTGRES_SMOKE_TEST: "true"
          POSTGRES_SMOKE_DATASOURCE_URL: jdbc:postgresql://localhost:5432/noviis_ci_app
          POSTGRES_SMOKE_DATASOURCE_USERNAME: noviis_ci
          POSTGRES_SMOKE_DATASOURCE_PASSWORD: noviis_ci

      - name: Verify previous backend against the expanded schema
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before || 'HEAD^') }}
          POSTGRES_SMOKE_TEST: "true"
          POSTGRES_SMOKE_DATASOURCE_URL: jdbc:postgresql://localhost:5432/noviis_ci
          POSTGRES_SMOKE_DATASOURCE_USERNAME: noviis_ci
          POSTGRES_SMOKE_DATASOURCE_PASSWORD: noviis_ci
          SPRING_FLYWAY_ENABLED: "false"
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/previous-backend"
          git worktree add --detach "$previous" "$BASE_REF"
          trap 'git worktree remove --force "$previous"' EXIT
          chmod +x "$previous/backend/gradlew"
          "$previous/backend/gradlew" -p "$previous/backend" test \
            --tests '*PostgresApplicationContextSmokeTest.contextLoadsWithPostgresMigrations' --rerun-tasks

  ops-config-test:
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Validate GitHub Actions workflows
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

      - name: Install workflow AST validator
        run: npm ci --ignore-scripts
        working-directory: frontend

      - name: Validate Prometheus configuration and rules
        run: |
          source deploy/monitoring/tool-versions.env
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/deploy/monitoring/prometheus:/etc/prometheus:ro" \
            "$PROMETHEUS_VALIDATION_IMAGE" \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/deploy/monitoring/prometheus:/etc/prometheus:ro" \
            "$PROMETHEUS_VALIDATION_IMAGE" \
            check rules /etc/prometheus/noviis-alerts.yml
          docker run --rm --entrypoint /bin/promtool -w /etc/prometheus \
            -v "$PWD/deploy/monitoring/prometheus:/etc/prometheus:ro" \
            "$PROMETHEUS_VALIDATION_IMAGE" \
            test rules noviis-alerts.test.yml

      - name: Verify scheduled job freshness manifest
        run: |
          python3 deploy/monitoring/verify-scheduled-jobs.py
          python3 deploy/monitoring/verify-required-backend-metrics.py
          bash deploy/monitoring/verify-resource-limit-evidence.sh

      - name: Validate Grafana version manifest and dashboard JSON
        run: |
          source deploy/monitoring/tool-versions.env
          [[ "$NODE_EXPORTER_MIN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          archive="$RUNNER_TEMP/grafana-${GRAFANA_VERSION}.${GRAFANA_ARCH}.tar.gz"
          extract_root="$RUNNER_TEMP/grafana-validation"
          curl --fail --location --retry 3 --proto '=https' \
            --output "$archive" \
            "https://dl.grafana.com/oss/release/grafana-${GRAFANA_VERSION}.${GRAFANA_ARCH}.tar.gz"
          bash deploy/monitoring/verify-grafana-archive.sh \
            "$archive" "$GRAFANA_ARCHIVE_SHA256" "$GRAFANA_ARCH"
          mkdir -p "$extract_root"
          tar -xzf "$archive" -C "$extract_root"
          grafana_binary="$(find "$extract_root" -type f -path '*/bin/grafana' -print -quit)"
          test -n "$grafana_binary"
          "$grafana_binary" --version | grep -F "Version ${GRAFANA_VERSION}"
          jq -e . deploy/monitoring/grafana/dashboards/noviis-overview.json >/dev/null

      - name: Validate shell scripts
        run: |
          find deploy -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          find backend/scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          find deploy -type f -name '*.sh' -print0 | xargs -0 -r shellcheck
          find backend/scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck

      - name: Validate sudoers policy and command matrix
        run: |
          sudo visudo -cf deploy/sudoers/noviis-deploy
          sudo bash deploy/sudoers/tests/noviis-deploy-test.sh

      - name: Run deployment script fixtures
        run: |
          bash deploy/scripts/tests/activate-backend-release-test.sh
          bash deploy/scripts/tests/verify-backend-start-state-test.sh
          bash deploy/scripts/tests/activate-frontend-release-test.sh
          bash deploy/scripts/tests/verify-active-frontend-release-test.sh
          bash deploy/scripts/tests/verify-release-provenance-test.sh
          bash deploy/scripts/tests/verify-deployment-freshness-test.sh
          bash deploy/scripts/tests/download-attestation-with-retry-test.sh
          bash deploy/scripts/tests/record-cleanup-debt-test.sh
          bash deploy/scripts/tests/verify-workflow-security-test.sh
          bash backend/scripts/tests/check-migration-compatibility-test.sh
          bash backend/scripts/tests/verify-contract-deployment-evidence-test.sh
          sudo bash deploy/monitoring/tests/rotate-grafana-admin-password-test.sh
          bash deploy/monitoring/tests/verify-grafana-archive-test.sh

      - name: Validate repository migration policy changes
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before || 'HEAD^') }}
          VERIFY_CONTRACT_RUNS: "false"
        run: bash backend/scripts/check-migration-compatibility.sh "$BASE_REF" HEAD

      - name: Validate production Nginx configuration
        run: bash deploy/scripts/test-nginx-config.sh

      - name: Validate systemd units and drop-ins
        run: |
          systemd-analyze verify deploy/systemd/app.service
          grep -Fqx 'OOMPolicy=stop' deploy/systemd/app.service
          grep -Fqx 'StartLimitIntervalSec=300' deploy/systemd/app.service
          grep -Fqx 'StartLimitBurst=5' deploy/systemd/app.service
          grep -Fqx 'ExecStartPre=+/usr/local/sbin/verify-noviis-backend-start-state' deploy/systemd/app.service
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for service in prometheus grafana-server; do
            mkdir -p "$tmp/${service}.service.d"
            printf '[Unit]\nDescription=CI fixture\n[Service]\nExecStart=/bin/true\n' > "$tmp/${service}.service"
            cp "deploy/monitoring/systemd/${service}.service.d/override.conf" "$tmp/${service}.service.d/override.conf"
            SYSTEMD_UNIT_PATH="$tmp" systemd-analyze verify "${service}.service"
          done
          mkdir -p "$tmp/prometheus-node-exporter.service.d"
          printf '[Unit]\nDescription=CI fixture\n[Service]\nExecStart=/bin/true\n' > "$tmp/prometheus-node-exporter.service"
          grep -Fqx 'ExecStart=/usr/bin/prometheus-node-exporter --web.listen-address=127.0.0.1:9100 --collector.textfile.directory=/var/lib/prometheus/node-exporter' \
            deploy/monitoring/systemd/prometheus-node-exporter.service.d/override.conf
          sed 's#/usr/bin/prometheus-node-exporter#/bin/true#' \
            deploy/monitoring/systemd/prometheus-node-exporter.service.d/override.conf \
            > "$tmp/prometheus-node-exporter.service.d/override.conf"
          SYSTEMD_UNIT_PATH="$tmp" systemd-analyze verify prometheus-node-exporter.service

      - name: Validate Compose configuration
        env:
          JWT_SECRET_DEV: Y2ktb25seS1kdW1teS1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcw==
        run: docker compose config --quiet

  trusted-contract-evidence:
    needs: changes
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.ops == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify applied contract deployment evidence
        env:
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || 'HEAD^' }}
          GH_TOKEN: ${{ github.token }}
          VERIFY_CONTRACT_RUNS: "true"
        run: bash backend/scripts/check-migration-compatibility.sh "$BASE_REF" HEAD

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - changes
      - backend-test
      - frontend-test
      - backend-postgres-migration
      - ops-config-test
      - trusted-contract-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      contract_migration: ${{ steps.verify.outputs.contract_migration }}
    steps:
      - name: Verify required jobs
        id: verify
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend-test.result }}
          FRONTEND_RESULT: ${{ needs.frontend-test.result }}
          POSTGRES_RESULT: ${{ needs.backend-postgres-migration.result }}
          OPS_RESULT: ${{ needs.ops-config-test.result }}
          TRUSTED_EVIDENCE_RESULT: ${{ needs.trusted-contract-evidence.result }}
          NEED_BACKEND: ${{ needs.changes.outputs.backend }}
          NEED_FRONTEND: ${{ needs.changes.outputs.frontend }}
          NEED_OPS: ${{ needs.changes.outputs.ops }}
          CONTRACT_MIGRATION: ${{ needs.backend-postgres-migration.outputs.contract_migration }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          DEPLOY_BACKEND: ${{ inputs.deploy_backend || false }}
          ALLOW_CONTRACT: ${{ inputs.allow_contract_migration || false }}
          BACKUP_SNAPSHOT_ID: ${{ inputs.backup_snapshot_id || '' }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection failed: $CHANGES_RESULT"
            exit 1
          fi

          verify_job() {
            local required="$1"
            local result="$2"
            local name="$3"
            if [ "$required" = "true" ] && [ "$result" != "success" ]; then
              echo "$name was required but finished as $result"
              exit 1
            fi
            if [ "$required" != "true" ] && [ "$result" != "skipped" ]; then
              echo "$name was not selected but finished as $result"
              exit 1
            fi
          }
          verify_job "$NEED_BACKEND" "$BACKEND_RESULT" backend-test
          verify_job "$NEED_BACKEND" "$POSTGRES_RESULT" backend-postgres-migration
          verify_job "$NEED_FRONTEND" "$FRONTEND_RESULT" frontend-test
          verify_job "$NEED_OPS" "$OPS_RESULT" ops-config-test
          need_trusted_evidence=false
          if [ "$GIT_REF" = refs/heads/main ] && [ "$EVENT_NAME" != pull_request ] \
            && { [ "$NEED_BACKEND" = true ] || [ "$NEED_OPS" = true ]; }; then
            need_trusted_evidence=true
          fi
          verify_job "$need_trusted_evidence" "$TRUSTED_EVIDENCE_RESULT" trusted-contract-evidence
          if [ "$CONTRACT_MIGRATION" != "true" ]; then CONTRACT_MIGRATION=false; fi
          if [ "$CONTRACT_MIGRATION" = "true" ] && [ "$EVENT_NAME" = workflow_dispatch ] && [ "$DEPLOY_BACKEND" = true ] && [ "$ALLOW_CONTRACT" = true ]; then
            if [[ ! "$BACKUP_SNAPSHOT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{2,255}$ ]]; then
              echo "Contract deployment requires a concrete backup snapshot identifier without whitespace"
              exit 1
            fi
          fi
          echo "contract_migration=$CONTRACT_MIGRATION" >> "$GITHUB_OUTPUT"

  candidate-backend:
    needs: [changes, ci-gate]
    if: >-
      needs.ci-gate.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.backend_changed == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_backend))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - name: Setup JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build backend release once after the CI gate
        working-directory: backend
        env:
          BUILD_COMMIT_SHA: ${{ github.sha }}
          BACKUP_SNAPSHOT_ID: ${{ inputs.backup_snapshot_id || '' }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew bootJar --no-daemon
          install -d -m 0755 release
          install -m 0644 build/libs/app.jar release/app.jar
          api_contract_revision="$(tr -d '\r\n' < ../docs/ops/api-contract-revision.txt)"
          [[ "$api_contract_revision" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          printf 'repository=%s\ncommit_sha=%s\nrun_id=%s\nrun_number=%s\nrun_attempt=%s\napi_contract_revision=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$api_contract_revision" > release/RELEASE_METADATA
          printf 'backup_snapshot_id=%s\n' "$BACKUP_SNAPSHOT_ID" >> release/RELEASE_METADATA
      - name: Generate backend SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: backend/release/app.jar
          format: spdx-json
          output-file: backend/release/sbom.spdx.json
          upload-artifact: false
      - name: Finalize backend checksum manifest
        run: |
          set -euo pipefail
          sha256sum app.jar RELEASE_METADATA sbom.spdx.json > SHA256SUMS
          printf 'release_type=backend\ncommit_sha=%s\n' "$GITHUB_SHA" > RELEASE_ENVELOPE
          sha256sum app.jar RELEASE_METADATA sbom.spdx.json SHA256SUMS >> RELEASE_ENVELOPE
        working-directory: backend/release
      - name: Upload untrusted backend candidate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: backend-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: backend/release
          if-no-files-found: error
          retention-days: 1

  release-backend:
    needs: [candidate-backend, ci-gate]
    if: needs.candidate-backend.result == 'success' && needs.ci-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download backend candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: backend/release
      - name: Verify candidate digest and immutable metadata
        working-directory: backend/release
        run: |
          set -euo pipefail
          sha256sum --strict --check SHA256SUMS
          grep -Fqx -- "repository=$GITHUB_REPOSITORY" RELEASE_METADATA
          grep -Fqx -- "commit_sha=$GITHUB_SHA" RELEASE_METADATA
          grep -Fqx -- "run_id=$GITHUB_RUN_ID" RELEASE_METADATA
          grep -Fqx -- "run_number=$GITHUB_RUN_NUMBER" RELEASE_METADATA
          grep -Fqx -- "run_attempt=$GITHUB_RUN_ATTEMPT" RELEASE_METADATA
      - name: Attest backend release
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: backend/release/RELEASE_ENVELOPE
      - name: Attest backend SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: backend/release/app.jar
          sbom-path: backend/release/sbom.spdx.json
      - name: Download backend attestation bundle for server verification
        working-directory: backend/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir envelope-attestation payload-attestation
          bash ../../deploy/scripts/download-attestation-with-retry.sh RELEASE_ENVELOPE "$GITHUB_REPOSITORY" envelope-attestation
          bash ../../deploy/scripts/download-attestation-with-retry.sh app.jar "$GITHUB_REPOSITORY" payload-attestation
          mapfile -t envelope_bundles < <(find envelope-attestation -maxdepth 1 -type f -name 'sha256*.jsonl' -print)
          mapfile -t payload_bundles < <(find payload-attestation -maxdepth 1 -type f -name 'sha256*.jsonl' -print)
          test "${#envelope_bundles[@]}" -eq 1
          test "${#payload_bundles[@]}" -eq 1
          cat -- "${envelope_bundles[0]}" "${payload_bundles[0]}" > PROVENANCE_BUNDLE.jsonl
          rm -rf -- envelope-attestation payload-attestation
      - name: Upload backend release
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: backend-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: backend/release
          if-no-files-found: error
          retention-days: 14

  candidate-frontend:
    needs: [changes, ci-gate]
    if: >-
      needs.ci-gate.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.frontend_changed == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_frontend))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend release once after the CI gate
        working-directory: frontend
        env:
          VITE_COMMIT_HASH: ${{ github.sha }}
          SEO_STRICT: "true"
          SEO_RELEASE_SHA: ${{ github.sha }}
          SITEMAP_SITE_URL: https://noviis.kr
          SITEMAP_API_BASE_URL: https://noviis.kr/api/v1
          PRERENDER_FETCH_RETRIES: 5
          PRERENDER_FETCH_RETRY_DELAY_MS: 2000
        run: |
          set -euo pipefail
          npm ci
          npm run build:seo
          api_contract_revision="$(tr -d '\r\n' < ../docs/ops/api-contract-revision.txt)"
          [[ "$api_contract_revision" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          printf '%s\n' "$GITHUB_SHA" > dist/.noviis-release
          printf '%s\n' "$api_contract_revision" > dist/.noviis-api-contract
          npm run seo:verify:dist
          tar -C dist -czf frontend-release.tar.gz .
          printf 'repository=%s\ncommit_sha=%s\nrun_id=%s\nrun_number=%s\nrun_attempt=%s\napi_contract_revision=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$api_contract_revision" > RELEASE_METADATA
      - name: Generate frontend SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: frontend/dist
          format: spdx-json
          output-file: frontend/sbom.spdx.json
          upload-artifact: false
      - name: Finalize frontend checksum manifest
        run: |
          set -euo pipefail
          sha256sum frontend-release.tar.gz RELEASE_METADATA sbom.spdx.json > SHA256SUMS
          printf 'release_type=frontend\ncommit_sha=%s\n' "$GITHUB_SHA" > RELEASE_ENVELOPE
          sha256sum frontend-release.tar.gz RELEASE_METADATA sbom.spdx.json SHA256SUMS >> RELEASE_ENVELOPE
        working-directory: frontend
      - name: Upload untrusted frontend candidate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: frontend-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            frontend/frontend-release.tar.gz
            frontend/RELEASE_METADATA
            frontend/SHA256SUMS
            frontend/sbom.spdx.json
            frontend/RELEASE_ENVELOPE
          if-no-files-found: error
          retention-days: 1

  release-frontend:
    needs: [candidate-frontend, ci-gate]
    if: needs.candidate-frontend.result == 'success' && needs.ci-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download frontend candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: frontend
      - name: Verify candidate digest and immutable metadata
        working-directory: frontend
        run: |
          set -euo pipefail
          sha256sum --strict --check SHA256SUMS
          grep -Fqx -- "repository=$GITHUB_REPOSITORY" RELEASE_METADATA
          grep -Fqx -- "commit_sha=$GITHUB_SHA" RELEASE_METADATA
          grep -Fqx -- "run_id=$GITHUB_RUN_ID" RELEASE_METADATA
          grep -Fqx -- "run_number=$GITHUB_RUN_NUMBER" RELEASE_METADATA
          grep -Fqx -- "run_attempt=$GITHUB_RUN_ATTEMPT" RELEASE_METADATA
      - name: Attest frontend release
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: frontend/RELEASE_ENVELOPE
      - name: Attest frontend SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: frontend/frontend-release.tar.gz
          sbom-path: frontend/sbom.spdx.json
      - name: Download frontend attestation bundle for server verification
        working-directory: frontend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir envelope-attestation payload-attestation
          bash ../deploy/scripts/download-attestation-with-retry.sh RELEASE_ENVELOPE "$GITHUB_REPOSITORY" envelope-attestation
          bash ../deploy/scripts/download-attestation-with-retry.sh frontend-release.tar.gz "$GITHUB_REPOSITORY" payload-attestation
          mapfile -t envelope_bundles < <(find envelope-attestation -maxdepth 1 -type f -name 'sha256*.jsonl' -print)
          mapfile -t payload_bundles < <(find payload-attestation -maxdepth 1 -type f -name 'sha256*.jsonl' -print)
          test "${#envelope_bundles[@]}" -eq 1
          test "${#payload_bundles[@]}" -eq 1
          cat -- "${envelope_bundles[0]}" "${payload_bundles[0]}" > PROVENANCE_BUNDLE.jsonl
          rm -rf -- envelope-attestation payload-attestation
      - name: Upload frontend release
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: frontend-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            frontend/frontend-release.tar.gz
            frontend/RELEASE_METADATA
            frontend/SHA256SUMS
            frontend/sbom.spdx.json
            frontend/RELEASE_ENVELOPE
            frontend/PROVENANCE_BUNDLE.jsonl
          if-no-files-found: error
          retention-days: 14

  deploy-backend:
    needs: [changes, ci-gate, release-backend]
    if: >-
      needs.ci-gate.result == 'success' &&
      needs.release-backend.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.backend_changed == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_backend)) &&
      (needs.ci-gate.outputs.contract_migration != 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.allow_contract_migration && inputs.backup_snapshot_id != ''))
    uses: ./.github/workflows/deploy-backend.yml
    permissions:
      contents: read
      attestations: read
      id-token: write
    with:
      expected_sha: ${{ github.sha }}
      release_artifact_name: backend-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      backup_snapshot_id: ${{ inputs.backup_snapshot_id || '' }}
      contract_migration: ${{ needs.ci-gate.outputs.contract_migration == 'true' }}
    secrets:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_HOST_FINGERPRINT: ${{ secrets.EC2_HOST_FINGERPRINT }}
      AWS_CONTRACT_EVIDENCE_ROLE_ARN: ${{ secrets.AWS_CONTRACT_EVIDENCE_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      RDS_PRODUCTION_DB_IDENTIFIER: ${{ secrets.RDS_PRODUCTION_DB_IDENTIFIER }}

  deploy-frontend:
    needs: [changes, ci-gate, release-frontend, deploy-backend]
    if: >-
      always() &&
      needs.ci-gate.result == 'success' &&
      needs.release-frontend.result == 'success' &&
      (needs.deploy-backend.result == 'success' ||
      (needs.deploy-backend.result == 'skipped' && needs.changes.outputs.backend_changed != 'true' &&
      !(github.event_name == 'workflow_dispatch' && inputs.deploy_backend))) &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.frontend_changed == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_frontend))
    uses: ./.github/workflows/deploy-frontend.yml
    permissions:
      contents: read
      attestations: read
    with:
      expected_sha: ${{ github.sha }}
      release_artifact_name: frontend-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      backend_activated_sha: ${{ needs.deploy-backend.outputs.activated_sha || '' }}
    secrets:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_HOST_FINGERPRINT: ${{ secrets.EC2_HOST_FINGERPRINT }}
      GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN: ${{ secrets.GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN }}
      GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_ID }}
      GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET }}
      GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN }}
      CUSTOM_SITEMAP_SUBMIT_URL: ${{ secrets.CUSTOM_SITEMAP_SUBMIT_URL }}
      CUSTOM_SITEMAP_SUBMIT_ALLOWED_ORIGINS: ${{ secrets.CUSTOM_SITEMAP_SUBMIT_ALLOWED_ORIGINS }}
