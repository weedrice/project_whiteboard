name: Deploy Frontend

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint:ci
        working-directory: frontend

      - name: Type check frontend
        run: npm run type-check
        working-directory: frontend

      - name: Test frontend
        run: npm run test:run
        working-directory: frontend

      - name: Build frontend
        run: npm run build:seo
        working-directory: frontend
        env:
          SITEMAP_SITE_URL: https://noviis.kr
          SITEMAP_API_BASE_URL: https://noviis.kr/api/v1
          PRERENDER_FETCH_RETRIES: 5
          PRERENDER_FETCH_RETRY_DELAY_MS: 2000

      - name: Verify pre-rendered share metadata
        run: npm run seo:verify:dist
        working-directory: frontend

      - name: Prepare frontend release directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            RELEASE_DIR="/var/www/releases/frontend/${{ github.sha }}-${{ github.run_id }}"
            sudo install -d -o ubuntu -g ubuntu -m 755 /var/www/releases/frontend
            rm -rf "$RELEASE_DIR"
            install -d -m 755 "$RELEASE_DIR"

      - name: Upload frontend build to release
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/var/www/releases/frontend/${{ github.sha }}-${{ github.run_id }}"
          strip_components: 2

      - name: Activate frontend release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            RELEASE_DIR="/var/www/releases/frontend/${{ github.sha }}-${{ github.run_id }}"
            test -f "$RELEASE_DIR/index.html"
            test -f "$RELEASE_DIR/robots.txt"
            test -f "$RELEASE_DIR/sitemap.xml"
            grep assets "$RELEASE_DIR/index.html"

            if grep -Eq '<loc>[^<]+/board/[^<]+/post/[0-9]+/?</loc>' "$RELEASE_DIR/sitemap.xml"; then
              POST_INDEX_LIST="$(mktemp)"
              trap 'rm -f "$POST_INDEX_LIST"' EXIT
              find "$RELEASE_DIR/board" -path '*/post/*/index.html' -type f > "$POST_INDEX_LIST" 2>/dev/null || true
              if [ ! -s "$POST_INDEX_LIST" ]; then
                echo "No pre-rendered post pages found in release directory"
                exit 1
              fi

              while IFS= read -r POST_INDEX; do
                if ! grep -qi 'rel="canonical"' "$POST_INDEX"; then
                  echo "Missing canonical link in $POST_INDEX"
                  exit 1
                fi
                if ! grep -qi 'application/ld+json' "$POST_INDEX"; then
                  echo "Missing JSON-LD in $POST_INDEX"
                  exit 1
                fi
              done < "$POST_INDEX_LIST"
            else
              echo "No post URLs found in sitemap; skipping pre-rendered post page checks"
            fi

            if [ -L /var/www/app ]; then
              sudo ln -sfn "$RELEASE_DIR" /var/www/app.next
              sudo mv -Tf /var/www/app.next /var/www/app
            else
              BACKUP_DIR="/var/www/app.previous.$(date +%s)"
              if [ -e /var/www/app ]; then
                sudo mv /var/www/app "$BACKUP_DIR"
              fi
              if ! sudo ln -s "$RELEASE_DIR" /var/www/app; then
                if [ -e "$BACKUP_DIR" ]; then
                  sudo mv "$BACKUP_DIR" /var/www/app
                fi
                exit 1
              fi
            fi

            ls -al /var/www/app
            grep assets /var/www/app/index.html
            CURRENT_RELEASE="$(readlink -f /var/www/app)"
            find /var/www/releases/frontend -mindepth 1 -maxdepth 1 -type d ! -path "$CURRENT_RELEASE" -printf '%T@ %p\n' | sort -n | head -n -5 | cut -d' ' -f2- | xargs -r rm -rf

      - name: Verify SEO after deploy
        run: npm run seo:verify
        working-directory: frontend
        env:
          SEO_SITE_URL: https://noviis.kr
          SEO_SITEMAP_URL: https://noviis.kr/sitemap.xml
          SEO_VERIFY_MAX_URLS: 10
          SEO_VERIFY_TIMEOUT_MS: 15000

      - name: Submit sitemap to search engines
        run: npm run seo:submit
        working-directory: frontend
        env:
          SEO_SITE_URL: https://noviis.kr
          SEO_SITEMAP_URL: https://noviis.kr/sitemap.xml
          GOOGLE_SEARCH_CONSOLE_SITE_URL: https://noviis.kr
          GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN: ${{ secrets.GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN }}
          GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_ID }}
          GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET }}
          GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN }}
          CUSTOM_SITEMAP_SUBMIT_URL: ${{ secrets.CUSTOM_SITEMAP_SUBMIT_URL }}
        continue-on-error: true
