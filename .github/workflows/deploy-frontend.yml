name: Deploy Frontend

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint:ci
        working-directory: frontend

      - name: Type check frontend
        run: npm run type-check
        working-directory: frontend

      - name: Test frontend
        run: npm run test:run
        working-directory: frontend

      - name: Build frontend
        run: npm run build:seo
        working-directory: frontend
        env:
          SITEMAP_SITE_URL: https://noviis.kr
          SITEMAP_API_BASE_URL: https://noviis.kr/api/v1

      - name: Prepare frontend release directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            RELEASE_DIR="/var/www/releases/frontend/${{ github.sha }}"
            sudo install -d -o ubuntu -g ubuntu -m 755 /var/www/releases/frontend
            rm -rf "$RELEASE_DIR"
            install -d -m 755 "$RELEASE_DIR"

      - name: Upload frontend build to release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/var/www/releases/frontend/${{ github.sha }}"
          strip_components: 2

      - name: Activate frontend release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            RELEASE_DIR="/var/www/releases/frontend/${{ github.sha }}"
            test -f "$RELEASE_DIR/index.html"
            grep assets "$RELEASE_DIR/index.html"

            if [ -L /var/www/app ]; then
              sudo ln -sfn "$RELEASE_DIR" /var/www/app.next
              sudo mv -Tf /var/www/app.next /var/www/app
            else
              BACKUP_DIR="/var/www/app.previous.$(date +%s)"
              if [ -e /var/www/app ]; then
                sudo mv /var/www/app "$BACKUP_DIR"
              fi
              if ! sudo ln -s "$RELEASE_DIR" /var/www/app; then
                if [ -e "$BACKUP_DIR" ]; then
                  sudo mv "$BACKUP_DIR" /var/www/app
                fi
                exit 1
              fi
            fi

            ls -al /var/www/app
            grep assets /var/www/app/index.html
            find /var/www/releases/frontend -mindepth 1 -maxdepth 1 -type d | sort | head -n -5 | xargs -r rm -rf

      - name: Verify SEO after deploy
        run: npm run seo:verify
        working-directory: frontend
        env:
          SEO_SITE_URL: https://noviis.kr
          SEO_SITEMAP_URL: https://noviis.kr/sitemap.xml
          SEO_VERIFY_MAX_URLS: 10
          SEO_VERIFY_TIMEOUT_MS: 15000

      - name: Submit sitemap to search engines
        run: npm run seo:submit
        working-directory: frontend
        env:
          SEO_SITE_URL: https://noviis.kr
          SEO_SITEMAP_URL: https://noviis.kr/sitemap.xml
          GOOGLE_SEARCH_CONSOLE_SITE_URL: https://noviis.kr
          GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN: ${{ secrets.GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN }}
          GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_ID }}
          GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET }}
          GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN }}
          CUSTOM_SITEMAP_SUBMIT_URL: ${{ secrets.CUSTOM_SITEMAP_SUBMIT_URL }}
        continue-on-error: true
