name: Deploy Frontend

on:
  workflow_call:
    outputs:
      activated_sha:
        description: Commit SHA verified by the frontend release endpoints
        value: ${{ jobs.deploy.outputs.activated_sha }}
    inputs:
      expected_sha:
        required: true
        type: string
      release_artifact_name:
        required: true
        type: string
      backend_activated_sha:
        required: false
        type: string
        default: ''
    secrets:
      EC2_HOST:
        required: true
      EC2_SSH_KEY:
        required: true
      EC2_USER:
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false
  queue: single

permissions:
  contents: read
  attestations: read

jobs:
  deploy:
    outputs:
      activated_sha: ${{ steps.activation-result.outputs.activated_sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout expected commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified frontend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.release_artifact_name }}
          path: release-artifact

      - name: Verify frontend artifact checksum
        run: |
          set -euo pipefail
          (cd release-artifact && sha256sum --strict --check SHA256SUMS)
          grep -Fqx -- "commit_sha=${{ inputs.expected_sha }}" release-artifact/RELEASE_METADATA
          grep -Fqx -- "repository=$GITHUB_REPOSITORY" release-artifact/RELEASE_METADATA
          grep -Fqx -- "run_id=$GITHUB_RUN_ID" release-artifact/RELEASE_METADATA
          grep -Fqx -- "run_number=$GITHUB_RUN_NUMBER" release-artifact/RELEASE_METADATA
          grep -Fqx -- "run_attempt=$GITHUB_RUN_ATTEMPT" release-artifact/RELEASE_METADATA

      - name: Verify frontend GitHub artifact attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify release-artifact/RELEASE_ENVELOPE --repo "$GITHUB_REPOSITORY" --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-ref refs/heads/main --source-digest "${{ inputs.expected_sha }}" --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners
          gh attestation verify release-artifact/frontend-release.tar.gz --repo "$GITHUB_REPOSITORY" --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-ref refs/heads/main --source-digest "${{ inputs.expected_sha }}" --predicate-type https://spdx.dev/Document/v2.3 --deny-self-hosted-runners

      - name: Setup Node for post-deploy verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Verify coordinated backend activation
        if: inputs.backend_activated_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          BACKEND_ACTIVATED_SHA: ${{ inputs.backend_activated_sha }}
        run: test "$BACKEND_ACTIVATED_SHA" = "$EXPECTED_SHA"

      - name: Prepare frontend staging directory
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            STAGING_DIR="/tmp/noviis-frontend-${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            case "$STAGING_DIR" in /tmp/noviis-frontend-*) ;; *) exit 64 ;; esac
            test ! -e "$STAGING_DIR"
            install -d -m 0700 "$STAGING_DIR"

      - name: Upload verified frontend artifact
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "release-artifact/frontend-release.tar.gz,release-artifact/RELEASE_METADATA,release-artifact/SHA256SUMS,release-artifact/sbom.spdx.json,release-artifact/RELEASE_ENVELOPE,release-artifact/PROVENANCE_BUNDLE.jsonl"
          target: "/tmp/noviis-frontend-${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          strip_components: 1

      - name: Reject a stale deployment immediately before activation
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          bash deploy/scripts/verify-deployment-freshness.sh "$EXPECTED_SHA" "$(git rev-parse origin/main)" frontend

      - name: Activate frontend release
        id: activate
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          capture_stdout: true
          script: |
            set -eu
            EXPECTED_SHA="${{ inputs.expected_sha }}"
            STAGING_DIR="/tmp/noviis-frontend-${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            NEXT_DIR="/var/www/app.next-${{ github.run_id }}-${{ github.run_attempt }}"
            BACKUP_DIR="/var/www/app.rollback-${{ github.run_id }}-${{ github.run_attempt }}"

            case "$STAGING_DIR" in /tmp/noviis-frontend-*) ;; *) exit 64 ;; esac
            case "$NEXT_DIR" in /var/www/app.next-*) ;; *) exit 64 ;; esac
            case "$BACKUP_DIR" in /var/www/app.rollback-*) ;; *) exit 64 ;; esac
            (cd "$STAGING_DIR" && sha256sum --strict --check SHA256SUMS)
            grep -Fqx -- "commit_sha=$EXPECTED_SHA" "$STAGING_DIR/RELEASE_METADATA"

            install -d -m 0700 "$STAGING_DIR/site"
            tar -xzf "$STAGING_DIR/frontend-release.tar.gz" -C "$STAGING_DIR/site" \
              --no-same-owner --no-same-permissions
            test "$(tr -d '\r\n' < "$STAGING_DIR/site/.noviis-release")" = "$EXPECTED_SHA"
            test -f "$STAGING_DIR/site/index.html"

            sudo rm -rf -- "$NEXT_DIR" "$BACKUP_DIR"
            sudo install -d -m 0755 "$NEXT_DIR"
            sudo cp -a "$STAGING_DIR/site/." "$NEXT_DIR/"
            test "$(sudo tr -d '\r\n' < "$NEXT_DIR/.noviis-release")" = "$EXPECTED_SHA"

            if sudo test -e /var/www/app; then
              sudo mv /var/www/app "$BACKUP_DIR"
            fi
            if ! sudo mv "$NEXT_DIR" /var/www/app; then
              if sudo test -e "$BACKUP_DIR"; then
                sudo mv "$BACKUP_DIR" /var/www/app
              fi
              exit 1
            fi

            if ! test "$(curl -fsS --max-time 10 --resolve noviis.kr:443:127.0.0.1 \
              https://noviis.kr/.noviis-release | tr -d '\r\n')" = "$EXPECTED_SHA"; then
              sudo rm -rf -- /var/www/app
              if sudo test -e "$BACKUP_DIR"; then
                sudo mv "$BACKUP_DIR" /var/www/app
              fi
              echo "Frontend internal release check failed" >&2
              exit 1
            fi

            echo "ACTIVATED_SHA=$EXPECTED_SHA"
            echo "ACTIVATED_RUN_ID=${{ github.run_id }}"
            echo "ACTIVATED_RUN_NUMBER=${{ github.run_number }}"
            echo "ACTIVATED_RUN_ATTEMPT=${{ github.run_attempt }}"

      - name: Reconcile frontend activation from independent readback
        id: reconcile
        if: always()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          capture_stdout: true
          script: |
            set -eu
            expected="${{ inputs.expected_sha }}"
            test "$(sudo tr -d '\r\n' < /var/www/app/.noviis-release)" = "$expected"
            test "$(curl -fsS --max-time 10 --resolve noviis.kr:443:127.0.0.1 https://noviis.kr/.noviis-release | tr -d '\r\n')" = "$expected"
            test "$(curl -fsS --max-time 10 https://noviis.kr/.noviis-release | tr -d '\r\n')" = "$expected"
            echo "ACTIVATED_SHA=$expected"
            echo "ACTIVATED_RUN_ID=${{ github.run_id }}"
            echo "ACTIVATED_RUN_NUMBER=${{ github.run_number }}"
            echo "ACTIVATED_RUN_ATTEMPT=${{ github.run_attempt }}"

      - name: Record verified frontend activation
        id: activation-result
        if: always()
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTIVATION_STDOUT: ${{ steps.reconcile.outputs.stdout }}
          RECONCILIATION_OUTCOME: ${{ steps.reconcile.outcome }}
        run: |
          set -euo pipefail
          test "$RECONCILIATION_OUTCOME" = success
          activated_sha="$(printf '%s\n' "$ACTIVATION_STDOUT" | sed -n 's/^ACTIVATED_SHA=//p' | tail -n 1)"
          test "$activated_sha" = "$EXPECTED_SHA"
          test "$(printf '%s\n' "$ACTIVATION_STDOUT" | sed -n 's/^ACTIVATED_RUN_ID=//p' | tail -n 1)" = "$GITHUB_RUN_ID"
          test "$(printf '%s\n' "$ACTIVATION_STDOUT" | sed -n 's/^ACTIVATED_RUN_NUMBER=//p' | tail -n 1)" = "$GITHUB_RUN_NUMBER"
          test "$(printf '%s\n' "$ACTIVATION_STDOUT" | sed -n 's/^ACTIVATED_RUN_ATTEMPT=//p' | tail -n 1)" = "$GITHUB_RUN_ATTEMPT"
          echo "activated_sha=$activated_sha" >> "$GITHUB_OUTPUT"

      - name: Verify SEO after deploy
        run: node frontend/scripts/verify-seo.mjs
        env:
          SEO_SITE_URL: https://noviis.kr
          SEO_SITEMAP_URL: https://noviis.kr/sitemap.xml
          SEO_VERIFY_MAX_URLS: 10
          SEO_VERIFY_TIMEOUT_MS: 15000
          SEO_REQUIRE_POST_URLS: "true"
          SEO_REQUIRE_RELEASE_MANIFEST: "true"
          SEO_EXPECTED_RELEASE_SHA: ${{ inputs.expected_sha }}

      - name: Roll back frontend after verification failure
        if: failure() && steps.activation-result.outcome == 'success'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            BACKUP_DIR="/var/www/app.rollback-${{ github.run_id }}-${{ github.run_attempt }}"
            case "$BACKUP_DIR" in /var/www/app.rollback-*) ;; *) exit 64 ;; esac
            sudo test -e "$BACKUP_DIR"
            sudo rm -rf -- /var/www/app
            sudo mv "$BACKUP_DIR" /var/www/app

      - name: Finalize frontend deployment
        if: success()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            BACKUP_DIR="/var/www/app.rollback-${{ github.run_id }}-${{ github.run_attempt }}"
            case "$BACKUP_DIR" in /var/www/app.rollback-*) ;; *) exit 64 ;; esac
            sudo rm -rf -- "$BACKUP_DIR"

      - name: Clean frontend staging directory
        if: always()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            STAGING_DIR="/tmp/noviis-frontend-${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            case "$STAGING_DIR" in /tmp/noviis-frontend-*) ;; *) exit 64 ;; esac
            if [ -e "$STAGING_DIR" ]; then
              rm -rf -- "$STAGING_DIR"
            fi
