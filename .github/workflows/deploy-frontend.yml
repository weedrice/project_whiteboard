name: Deploy Frontend

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build:seo
        working-directory: frontend
        env:
          SITEMAP_SITE_URL: https://noviis.kr
          SITEMAP_API_BASE_URL: https://noviis.kr/api/v1

      - name: Clean frontend directory on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            rm -rf /var/www/app/*
            mkdir -p /var/www/app

      - name: Upload frontend build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/var/www/app"
          strip_components: 2

      - name: Verify frontend deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ls -al /var/www/app
            grep assets /var/www/app/index.html

      - name: Verify SEO after deploy
        run: npm run seo:verify
        working-directory: frontend
        env:
          SEO_SITE_URL: https://noviis.kr
          SEO_SITEMAP_URL: https://noviis.kr/sitemap.xml
          SEO_VERIFY_MAX_URLS: 10
          SEO_VERIFY_TIMEOUT_MS: 15000

      - name: Submit sitemap to search engines
        run: npm run seo:submit
        working-directory: frontend
        env:
          SEO_SITE_URL: https://noviis.kr
          SEO_SITEMAP_URL: https://noviis.kr/sitemap.xml
          GOOGLE_SEARCH_CONSOLE_SITE_URL: https://noviis.kr
          GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN: ${{ secrets.GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN }}
          GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_ID }}
          GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET }}
          GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN }}
          CUSTOM_SITEMAP_SUBMIT_URL: ${{ secrets.CUSTOM_SITEMAP_SUBMIT_URL }}
        continue-on-error: true
