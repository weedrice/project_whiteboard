name: Deploy Frontend

on:
  workflow_call:
    outputs:
      activated_sha:
        description: Commit SHA verified by the frontend release endpoints
        value: ${{ jobs.deploy.outputs.activated_sha }}
    inputs:
      expected_sha:
        required: true
        type: string
      release_artifact_name:
        required: true
        type: string
      backend_activated_sha:
        required: false
        type: string
        default: ''
    secrets:
      EC2_HOST:
        required: true
      EC2_SSH_KEY:
        required: true
      EC2_HOST_FINGERPRINT:
        required: true
      GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN:
        required: false
      GOOGLE_SEARCH_CONSOLE_CLIENT_ID:
        required: false
      GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET:
        required: false
      GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN:
        required: false
      CUSTOM_SITEMAP_SUBMIT_URL:
        required: false
      CUSTOM_SITEMAP_SUBMIT_ALLOWED_ORIGINS:
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  attestations: read

jobs:
  deploy:
    outputs:
      activated_sha: ${{ steps.activation-result.outputs.activated_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout expected commit
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified frontend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.release_artifact_name }}
          path: release-artifact

      - name: Verify frontend artifact checksum
        run: |
          set -euo pipefail
          (cd release-artifact && sha256sum --strict --check SHA256SUMS)
          grep -Fqx -- "commit_sha=${{ inputs.expected_sha }}" release-artifact/RELEASE_METADATA
          grep -Fqx -- "repository=$GITHUB_REPOSITORY" release-artifact/RELEASE_METADATA
          grep -Fqx -- "run_id=$GITHUB_RUN_ID" release-artifact/RELEASE_METADATA
          grep -Fqx -- "run_number=$GITHUB_RUN_NUMBER" release-artifact/RELEASE_METADATA
          grep -Fqx -- "run_attempt=$GITHUB_RUN_ATTEMPT" release-artifact/RELEASE_METADATA

      - name: Verify frontend GitHub artifact attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify release-artifact/RELEASE_ENVELOPE --repo "$GITHUB_REPOSITORY" --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-ref refs/heads/main --source-digest "${{ inputs.expected_sha }}" --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners
          gh attestation verify release-artifact/frontend-release.tar.gz --repo "$GITHUB_REPOSITORY" --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-ref refs/heads/main --source-digest "${{ inputs.expected_sha }}" --predicate-type https://spdx.dev/Document/v2.3 --deny-self-hosted-runners

      - name: Setup Node for post-deploy verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Read signed frontend API contract revision
        id: api-contract
        run: |
          set -euo pipefail
          revision="$(sed -n 's/^api_contract_revision=//p' release-artifact/RELEASE_METADATA)"
          [[ "$revision" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Validate production SEO provider configuration
        run: node frontend/scripts/submit-search-engines.mjs
        env:
          GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN: ${{ secrets.GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN }}
          GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_ID }}
          GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET }}
          GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN }}
          CUSTOM_SITEMAP_SUBMIT_URL: ${{ secrets.CUSTOM_SITEMAP_SUBMIT_URL }}
          CUSTOM_SITEMAP_SUBMIT_ALLOWED_ORIGINS: ${{ secrets.CUSTOM_SITEMAP_SUBMIT_ALLOWED_ORIGINS }}
          SEO_SUBMIT_REQUIRED: "true"
          SEO_VALIDATE_ONLY: "true"

      - name: Verify active backend API contract
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: noviis-deploy
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          script: |
            set -eu
            test "$(sha256sum /usr/local/sbin/verify-noviis-backend | awk '{print $1}')" = "${{ hashFiles('deploy/scripts/verify-active-backend-release.sh') }}"
            sudo /usr/local/sbin/verify-noviis-backend --contract "${{ steps.api-contract.outputs.revision }}"

      - name: Prepare frontend release directory
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: noviis-deploy
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          script: |
            set -eu
            test "$(sha256sum /usr/local/sbin/activate-noviis-frontend | awk '{print $1}')" = "${{ hashFiles('deploy/scripts/activate-frontend-release.sh') }}"
            test "$(sha256sum /usr/local/sbin/verify-noviis-backend | awk '{print $1}')" = "${{ hashFiles('deploy/scripts/verify-active-backend-release.sh') }}"
            test "$(sha256sum /usr/local/sbin/verify-noviis-frontend | awk '{print $1}')" = "${{ hashFiles('deploy/scripts/verify-active-frontend-release.sh') }}"
            test "$(sha256sum /usr/local/sbin/verify-noviis-release | awk '{print $1}')" = "${{ hashFiles('deploy/scripts/verify-release-provenance.sh') }}"
            test "$(sha256sum /usr/local/sbin/record-noviis-cleanup-debt | awk '{print $1}')" = "${{ hashFiles('deploy/scripts/record-cleanup-debt.sh') }}"
            RELEASE_DIR="/var/www/incoming/frontend/${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            install -d -m 0755 /var/www/incoming/frontend
            test ! -e "$RELEASE_DIR"
            install -d -m 0755 "$RELEASE_DIR"

      - name: Upload verified frontend artifact
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: noviis-deploy
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          source: "release-artifact/frontend-release.tar.gz,release-artifact/RELEASE_METADATA,release-artifact/SHA256SUMS,release-artifact/sbom.spdx.json,release-artifact/RELEASE_ENVELOPE,release-artifact/PROVENANCE_BUNDLE.jsonl"
          target: "/var/www/incoming/frontend/${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          strip_components: 1

      - name: Reject a stale deployment immediately before activation
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          bash deploy/scripts/verify-deployment-freshness.sh "$EXPECTED_SHA" "$(git rev-parse origin/main)" frontend

      - name: Activate frontend release
        id: activate
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: noviis-deploy
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          capture_stdout: true
          script: |
            set -eu
            RELEASE_DIR="/var/www/incoming/frontend/${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            sudo /usr/local/sbin/activate-noviis-frontend "$RELEASE_DIR" activate "${{ inputs.expected_sha }}" \
              "${{ github.run_id }}" "${{ github.run_attempt }}" "${{ github.run_number }}"

      - name: Reconcile frontend activation from independent readback
        id: reconcile
        if: always()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: noviis-deploy
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          capture_stdout: true
          script: |
            set -eu
            expected="${{ inputs.expected_sha }}"
            test "$(curl -fsS --max-time 10 --resolve noviis.kr:443:127.0.0.1 https://noviis.kr/.noviis-release | tr -d '\r\n')" = "$expected"
            test "$(curl -fsS --max-time 10 https://noviis.kr/.noviis-release | tr -d '\r\n')" = "$expected"
            sudo /usr/local/sbin/verify-noviis-frontend "$expected" \
              "${{ github.run_id }}" "${{ github.run_number }}" "${{ github.run_attempt }}"
            release_dir="/var/www/releases/frontend/${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            current_run_activated=false
            if [ -f "$release_dir/ACTIVATED" ] && [ ! -L "$release_dir/ACTIVATED" ] \
              && [ "$(tr -d '\r\n' < "$release_dir/ACTIVATED")" = "$expected" ]; then
              current_run_activated=true
            fi
            echo "CURRENT_RUN_ACTIVATED=$current_run_activated"

      - name: Record verified frontend activation
        id: activation-result
        if: always()
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          BACKEND_ACTIVATED_SHA: ${{ inputs.backend_activated_sha }}
          ACTIVATION_STDOUT: ${{ steps.reconcile.outputs.stdout }}
          ACTIVATOR_STDOUT: ${{ steps.activate.outputs.stdout }}
          RECONCILIATION_OUTCOME: ${{ steps.reconcile.outcome }}
        run: |
          set -euo pipefail
          test "$RECONCILIATION_OUTCOME" = success
          activated_sha="$(printf '%s\n' "$ACTIVATION_STDOUT" | sed -n 's/^ACTIVATED_SHA=//p' | tail -n 1)"
          test "$activated_sha" = "$EXPECTED_SHA"
          test "$(printf '%s\n' "$ACTIVATION_STDOUT" | sed -n 's/^ACTIVATED_RUN_ID=//p' | tail -n 1)" = "$GITHUB_RUN_ID"
          test "$(printf '%s\n' "$ACTIVATION_STDOUT" | sed -n 's/^ACTIVATED_RUN_NUMBER=//p' | tail -n 1)" = "$GITHUB_RUN_NUMBER"
          test "$(printf '%s\n' "$ACTIVATION_STDOUT" | sed -n 's/^ACTIVATED_RUN_ATTEMPT=//p' | tail -n 1)" = "$GITHUB_RUN_ATTEMPT"
          if [ "${{ steps.activate.outcome }}" != success ]; then
            echo "::warning title=Activation transport reconciled::The activation channel failed, but independent internal and public reads prove the expected frontend release is active."
          fi
          while IFS= read -r cleanup_debt; do
            [ -n "$cleanup_debt" ] || continue
            echo "::warning title=Frontend cleanup debt::$cleanup_debt"
            echo "$cleanup_debt" >> "$GITHUB_STEP_SUMMARY"
          done < <(printf '%s\n' "$ACTIVATOR_STDOUT" | grep '^CLEANUP_DEBT=' || true)
          echo "activated_sha=$activated_sha" >> "$GITHUB_OUTPUT"
          current_run_activated="$(printf '%s\n' "$ACTIVATION_STDOUT" | sed -n 's/^CURRENT_RUN_ACTIVATED=//p' | tail -n 1)"
          case "$current_run_activated" in true|false) ;; *) exit 1 ;; esac
          echo "current_run_activated=$current_run_activated" >> "$GITHUB_OUTPUT"

      - name: Verify SEO after deploy
        run: node frontend/scripts/verify-seo.mjs
        env:
          SEO_SITE_URL: https://noviis.kr
          SEO_SITEMAP_URL: https://noviis.kr/sitemap.xml
          SEO_VERIFY_MAX_URLS: 10
          SEO_VERIFY_TIMEOUT_MS: 15000
          SEO_REQUIRE_POST_URLS: "true"
          SEO_REQUIRE_RELEASE_MANIFEST: "true"
          SEO_EXPECTED_RELEASE_SHA: ${{ inputs.expected_sha }}

      - name: Roll back frontend after verification failure
        if: failure() && steps.activation-result.outcome == 'success' && steps.activation-result.outputs.current_run_activated == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: noviis-deploy
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          script: |
            set -eu
            RELEASE_DIR="/var/www/releases/frontend/${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            sudo /usr/local/sbin/activate-noviis-frontend "$RELEASE_DIR" rollback "${{ inputs.expected_sha }}"

      - name: Clean frontend incoming release
        id: cleanup
        if: always()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: noviis-deploy
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          script: |
            set -eu
            RELEASE_DIR="/var/www/incoming/frontend/${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            if [ -e "$RELEASE_DIR" ]; then
              case "$(realpath "$RELEASE_DIR")/" in /var/www/incoming/frontend/*/) rm -rf -- "$RELEASE_DIR" ;; *) exit 1 ;; esac
            fi
            sudo /usr/local/sbin/record-noviis-cleanup-debt frontend reconcile incoming_release
        continue-on-error: true

      - name: Persist frontend cleanup debt
        if: always() && steps.cleanup.outcome == 'failure'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: noviis-deploy
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          script: sudo /usr/local/sbin/record-noviis-cleanup-debt frontend reconcile incoming_release || [ "$?" -eq 2 ]

      - name: Report frontend cleanup debt
        if: always() && steps.cleanup.outcome == 'failure'
        run: |
          echo "::warning title=Frontend cleanup debt::The verified frontend release remains active; incoming cleanup requires operator follow-up."
          echo "Frontend incoming cleanup failed after activation of ${{ inputs.expected_sha }}." >> "$GITHUB_STEP_SUMMARY"

  submit-seo:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: seo-submit-production
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout expected commit
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Submit sitemap to search engines
        id: seo-submit
        run: node frontend/scripts/submit-search-engines.mjs
        env:
          SEO_SITE_URL: https://noviis.kr
          SEO_SITEMAP_URL: https://noviis.kr/sitemap.xml
          GOOGLE_SEARCH_CONSOLE_SITE_URL: https://noviis.kr
          GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN: ${{ secrets.GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN }}
          GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_ID }}
          GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET }}
          GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN }}
          CUSTOM_SITEMAP_SUBMIT_URL: ${{ secrets.CUSTOM_SITEMAP_SUBMIT_URL }}
          CUSTOM_SITEMAP_SUBMIT_ALLOWED_ORIGINS: ${{ secrets.CUSTOM_SITEMAP_SUBMIT_ALLOWED_ORIGINS }}
          SEO_SUBMIT_REQUIRED: "true"

      - name: Persist SEO submission debt state
        if: always()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: noviis-deploy
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          script: >-
            sudo /usr/local/sbin/record-noviis-cleanup-debt frontend
            ${{ steps.seo-submit.outcome == 'success' && 'clear' || 'set' }} seo_submission
