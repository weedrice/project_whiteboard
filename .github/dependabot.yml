version: 2

updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 10
    ignore:
      # H2 2.4.240 has a known cross-session CHECK constraint regression.
      - dependency-name: "com.h2database:h2"
        versions:
          - "2.4.240"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 10
    groups:
      tiptap:
        patterns:
          - "@tiptap/*"
    ignore:
      # Keep Node.js typings aligned with the Node 24 runtime baseline.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "pinia"
        versions:
          - "4.0.1"
      # lucide-vue-next 1.0.0 was published unintentionally; use a corrected release instead.
      - dependency-name: "lucide-vue-next"
        versions:
          - "1.0.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "10:40"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    ignore:
      # Keep Java runtime baseline upgrades explicit and coordinated with Gradle and CI.
      - dependency-name: "eclipse-temurin"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "10:50"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    ignore:
      # Coordinate Node.js major upgrades across Docker, CI, typings, and docs.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
