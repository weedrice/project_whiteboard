add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS는 되돌리기 비용이 크므로 단계적으로 올린다: 1일 -> 7일(현재) -> 6개월 -> 1년.
# 다음 단계로 올리기 전 최소 한 주기 동안 HTTPS 경로에 문제가 없었는지 확인한다.
# includeSubDomains는 cdn.noviis.kr 등 하위 도메인의 TLS 구성을 확인한 뒤 별도로 검토한다.
add_header Strict-Transport-Security "max-age=604800" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; connect-src 'self'; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; child-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; report-uri /api/v1/security/csp-report;" always;
