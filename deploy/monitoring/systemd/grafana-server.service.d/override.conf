[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
EnvironmentFile=/etc/noviis/monitoring.env
ExecStartPre=/bin/sh -ec 'test -f /etc/noviis/monitoring.env; test -s /etc/noviis/monitoring.env; test ! -L /etc/noviis/monitoring.env'
ExecStartPre=/bin/sh -ec 'test "$$(stat -c %U:%G /etc/noviis/monitoring.env)" = root:root; test "$$(stat -c %a /etc/noviis/monitoring.env)" = 600; test "$${#GF_SECURITY_ADMIN_PASSWORD}" -ge 16'
Environment=GF_SERVER_HTTP_ADDR=127.0.0.1
Environment=GF_SERVER_HTTP_PORT=3000
Environment=GF_USERS_ALLOW_SIGN_UP=false
Environment=GF_AUTH_ANONYMOUS_ENABLED=false
Restart=on-failure
RestartSec=5
OOMPolicy=stop
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ProtectHome=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictSUIDSGID=true
LockPersonality=true
CapabilityBoundingSet=
AmbientCapabilities=
ReadWritePaths=/var/lib/grafana /var/log/grafana /run/grafana
