global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/noviis-alerts.yml
  # No optional files are installed for the current inline deployment profile.
  - /etc/prometheus/optional/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: noviis-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:8081"]

  - job_name: noviis-host
    file_sd_configs:
      - files: ["/etc/prometheus/targets/noviis-host.json"]

  - job_name: noviis-host-contract
    file_sd_configs:
      - files: ["/etc/prometheus/targets/noviis-host-contract.json"]
