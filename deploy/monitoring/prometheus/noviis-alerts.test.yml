rule_files:
  - noviis-alerts.yml

evaluation_interval: 1m

tests:
  - name: missing Prometheus self target is treated as down
    interval: 1m
    alert_rule_test:
      - eval_time: 2m
        alertname: NoviIsPrometheusSelfScrapeDown
        exp_alerts:
          - exp_labels:
              job: prometheus
              severity: critical
            exp_annotations:
              summary: "Prometheus has failed to scrape its own metrics for 2 minutes"

  - name: Prometheus internal failures are observable
    interval: 1m
    input_series:
      - series: 'prometheus_rule_evaluation_failures_total'
        values: '0 0 1 1'
      - series: 'prometheus_config_last_reload_successful'
        values: '0+0x4'
      - series: 'prometheus_tsdb_compactions_failed_total'
        values: '0 0 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: NoviIsPrometheusRuleEvaluationFailure
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Prometheus recorded a rule evaluation failure"
      - eval_time: 3m
        alertname: NoviIsPrometheusConfigReloadFailure
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Prometheus configuration reload is failing"
      - eval_time: 3m
        alertname: NoviIsPrometheusTsdbFailure
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Prometheus TSDB recorded a persistence failure"

  - name: required backend metrics are absent after startup grace
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{instance="localhost:8081",job="noviis-backend"}'
        values: '0+0x15'
      - series: 'noviis_feed_generation_jobs_pending'
        values: '0+0x15'
      - series: 'noviis_feed_generation_jobs_failed'
        values: '0+0x15'
      - series: 'noviis_feed_generation_jobs_oldest_pending_age_seconds'
        values: '0+0x15'
      - series: 'noviis_feed_generation_jobs_processed_total{result="success"}'
        values: '0+0x15'
      - series: 'noviis_notification_delivery_jobs_oldest_due_age_seconds'
        values: '0+0x15'
      - series: 'noviis_notification_keyword_fanout_jobs_pending'
        values: '0+0x15'
      - series: 'noviis_notification_keyword_fanout_jobs_dead_letter'
        values: '0+0x15'
      - series: 'noviis_notification_keyword_fanout_jobs_oldest_due_age_seconds'
        values: '0+0x15'
      - series: 'noviis_notification_keyword_fanout_jobs_total{outcome="retry"}'
        values: '0+0x15'
      - series: 'noviis_file_variant_cleanup_dead_letter'
        values: '0+0x15'
      - series: 'noviis_file_variant_cleanup_oldest_due_age_seconds'
        values: '0+0x15'
      - series: 'noviis_file_variant_cleanup_total{outcome="retry"}'
        values: '0+0x15'
      - series: 'noviis_semantic_reindex_jobs_pending'
        values: '0+0x15'
      - series: 'noviis_semantic_reindex_jobs_processing'
        values: '0+0x15'
      - series: 'noviis_semantic_reindex_jobs_oldest_active_age_seconds'
        values: '0+0x15'
      - series: 'noviis_semantic_reindex_jobs_processed_total{result="success"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: NoviIsRequiredBackendMetricMissing
        exp_alerts: []
      - eval_time: 13m
        alertname: NoviIsRequiredBackendMetricMissing
        exp_alerts:
          - exp_labels:
              missing_metric: hikaricp_connections_max
              severity: warning
            exp_annotations:
              summary: "Required backend metric hikaricp_connections_max is missing"
              description: "The backend has been up for more than 10 minutes without exporting this required metric."
          - exp_labels:
              missing_metric: noviis_async_active
              severity: warning
            exp_annotations:
              summary: "Required backend metric noviis_async_active is missing"
              description: "The backend has been up for more than 10 minutes without exporting this required metric."
          - exp_labels:
              missing_metric: noviis_async_queue_depth
              severity: warning
            exp_annotations:
              summary: "Required backend metric noviis_async_queue_depth is missing"
              description: "The backend has been up for more than 10 minutes without exporting this required metric."
          - exp_labels:
              missing_metric: noviis_async_queue_remaining
              severity: warning
            exp_annotations:
              summary: "Required backend metric noviis_async_queue_remaining is missing"
              description: "The backend has been up for more than 10 minutes without exporting this required metric."
          - exp_labels:
              missing_metric: noviis_async_rejected_total
              severity: warning
            exp_annotations:
              summary: "Required backend metric noviis_async_rejected_total is missing"
              description: "The backend has been up for more than 10 minutes without exporting this required metric."
          - exp_labels:
              missing_metric: noviis_feed_generation_jobs_processing
              severity: warning
            exp_annotations:
              summary: "Required backend metric noviis_feed_generation_jobs_processing is missing"
              description: "The backend has been up for more than 10 minutes without exporting this required metric."
          - exp_labels:
              missing_metric: noviis_notification_delivery_jobs_dead_letter
              severity: warning
            exp_annotations:
              summary: "Required backend metric noviis_notification_delivery_jobs_dead_letter is missing"
              description: "The backend has been up for more than 10 minutes without exporting this required metric."
          - exp_labels:
              missing_metric: noviis_notification_delivery_jobs_pending
              severity: warning
            exp_annotations:
              summary: "Required backend metric noviis_notification_delivery_jobs_pending is missing"
              description: "The backend has been up for more than 10 minutes without exporting this required metric."
          - exp_labels:
              missing_metric: noviis_notification_delivery_jobs_oldest_lease_age_seconds
              severity: warning
            exp_annotations:
              summary: "Required backend metric noviis_notification_delivery_jobs_oldest_lease_age_seconds is missing"
              description: "The backend has been up for more than 10 minutes without exporting this required metric."
          - exp_labels:
              area: heap
              missing_metric: jvm_memory_used_bytes
              severity: warning
            exp_annotations:
              summary: "Required backend metric jvm_memory_used_bytes is missing"
              description: "The backend has been up for more than 10 minutes without exporting this required metric."
          - exp_labels:
              missing_metric: noviis_semantic_jobs_oldest_age_seconds
              severity: warning
            exp_annotations:
              summary: "Required backend metric noviis_semantic_jobs_oldest_age_seconds is missing"
              description: "The backend has been up for more than 10 minutes without exporting this required metric."
          - exp_labels:
              missing_metric: noviis_semantic_jobs_pending
              severity: warning
            exp_annotations:
              summary: "Required backend metric noviis_semantic_jobs_pending is missing"
              description: "The backend has been up for more than 10 minutes without exporting this required metric."
          - exp_labels:
              missing_metric: noviis_semantic_reindex_jobs_failed
              severity: warning
            exp_annotations:
              summary: "Required backend metric noviis_semantic_reindex_jobs_failed is missing"
              description: "The backend has been up for more than 10 minutes without exporting this required metric."
          - exp_labels:
              missing_metric: noviis_sse_heartbeat_gap_seconds
              severity: warning
            exp_annotations:
              summary: "Required backend metric noviis_sse_heartbeat_gap_seconds is missing"
              description: "The backend has been up for more than 10 minutes without exporting this required metric."
          - exp_labels:
              missing_metric: noviis_webpush_job_backlog
              severity: warning
            exp_annotations:
              summary: "Required backend metric noviis_webpush_job_backlog is missing"
              description: "The backend has been up for more than 10 minutes without exporting this required metric."
          - exp_labels:
              missing_metric: noviis_webpush_job_oldest_age_seconds
              severity: warning
            exp_annotations:
              summary: "Required backend metric noviis_webpush_job_oldest_age_seconds is missing"
              description: "The backend has been up for more than 10 minutes without exporting this required metric."
          - exp_labels:
              missing_metric: noviis_webpush_job_outcome_total
              severity: warning
            exp_annotations:
              summary: "Required backend metric noviis_webpush_job_outcome_total is missing"
              description: "The backend has been up for more than 10 minutes without exporting this required metric."

  - name: missing backend target is treated as down
    interval: 1m
    alert_rule_test:
      - eval_time: 2m
        alertname: NoviIsBackendDown
        exp_alerts:
          - exp_labels:
              job: noviis-backend
              severity: critical
            exp_annotations:
              summary: "NoviIs backend metrics scrape has failed for 2 minutes"

  - name: heartbeat never-run state becomes delayed after startup grace
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{instance="localhost:8081",job="noviis-backend"}'
        values: '0+0x3'
      - series: 'noviis_sse_heartbeat_gap_seconds'
        values: '0+0x3'
    alert_rule_test:
      - eval_time: 2m
        alertname: NoviIsHeartbeatDelayed
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "SSE heartbeat has not run within 40 seconds"

  - name: Prometheus uptime does not bypass backend startup grace
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{instance="localhost:9090",job="prometheus"}'
        values: '0+0x15'
      - series: 'process_start_time_seconds{instance="localhost:8081",job="noviis-backend"}'
        values: '650+0x15'
      - series: 'noviis_sse_heartbeat_gap_seconds'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: NoviIsScheduledJobStale
        exp_alerts: []
      - eval_time: 11m
        alertname: NoviIsHeartbeatDelayed
        exp_alerts: []

  - name: scheduled job absence waits for the configured startup grace
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{instance="localhost:8081",job="noviis-backend"}'
        values: '0+0x15'
      - series: 'noviis_scheduler_last_success_timestamp_seconds{scheduled_job="FeedGenerationJobScheduler.processPendingFeedGenerationJobs"}'
        values: '600+0x15'
      - series: 'noviis_scheduler_last_success_timestamp_seconds{scheduled_job="FileDeletionScheduler.processPendingDeletions"}'
        values: '600+0x15'
      - series: 'noviis_scheduler_last_success_timestamp_seconds{scheduled_job="MqueueScheduler.processMessageQueue"}'
        values: '600+0x15'
      - series: 'noviis_scheduler_last_success_timestamp_seconds{scheduled_job="NotificationDeliveryJobScheduler.processPendingJobs"}'
        values: '600+0x15'
      - series: 'noviis_scheduler_last_success_timestamp_seconds{scheduled_job="NotificationSseEmitterRegistry.sendHeartbeat"}'
        values: '600+0x15'
      - series: 'noviis_scheduler_last_success_timestamp_seconds{scheduled_job="PushDeliveryJobScheduler.processPendingJobs"}'
        values: '600+0x15'
      - series: 'noviis_scheduler_last_success_timestamp_seconds{scheduled_job="ScheduledPostPublisherScheduler.publishDuePosts"}'
        values: '600+0x15'
      - series: 'noviis_scheduler_last_success_timestamp_seconds{scheduled_job="SemanticSearchJobScheduler.processPendingSemanticSearchJobs"}'
        values: '600+0x15'
      - series: 'noviis_scheduler_last_success_timestamp_seconds{scheduled_job="FileVariantCleanupScheduler.cleanupStaleVariants"}'
        values: '600+0x15'
    alert_rule_test:
      - eval_time: 9m
        alertname: NoviIsScheduledJobStale
        exp_alerts: []
      - eval_time: 11m
        alertname: NoviIsScheduledJobStale
        exp_alerts:
          - exp_labels:
              cadence: frequent
              scheduled_job: SemanticSearchJobMetrics.refresh
              severity: warning
              threshold: 10m
            exp_annotations:
              summary: "Scheduled job SemanticSearchJobMetrics.refresh has no recent success"
              description: "No successful completion was observed within the configured 10m threshold for this frequent job."

  - name: sustained HTTP 5xx ratio fires only after the hold duration
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{status="200"}'
        values: '0+54x15'
      - series: 'http_server_requests_seconds_count{status="500"}'
        values: '0+6x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: NoviIsHttp5xxRateHigh
        exp_alerts: []
      - eval_time: 11m
        alertname: NoviIsHttp5xxRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "HTTP 5xx responses exceeded 5 percent for 10 minutes with at least 20 requests per 5 minutes"

  - name: sustained HTTP p95 latency uses histogram buckets
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{status="200"}'
        values: '0+100x15'
      - series: 'http_server_requests_seconds_bucket{le="0.1"}'
        values: '0+20x15'
      - series: 'http_server_requests_seconds_bucket{le="0.5"}'
        values: '0+50x15'
      - series: 'http_server_requests_seconds_bucket{le="1.0"}'
        values: '0+80x15'
      - series: 'http_server_requests_seconds_bucket{le="2.0"}'
        values: '0+100x15'
      - series: 'http_server_requests_seconds_bucket{le="+Inf"}'
        values: '0+100x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: NoviIsHttpP95LatencyHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "HTTP server p95 latency exceeded 1 second for 10 minutes with at least 20 requests per 5 minutes"

  - name: sustained HikariCP saturation fires after ten minutes
    interval: 1m
    input_series:
      - series: 'hikaricp_connections_active{pool="HikariPool-1"}'
        values: '9+0x15'
      - series: 'hikaricp_connections_max{pool="HikariPool-1"}'
        values: '10+0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: NoviIsHikariPoolSaturated
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "HikariCP active connections exceeded 85 percent of the configured maximum for 10 minutes"

  - name: scheduler backlog requires saturation and queue growth
    interval: 1m
    input_series:
      - series: 'noviis_scheduler_pool_active{pool="common"}'
        values: '4+0x20'
      - series: 'noviis_scheduler_pool_size{pool="common"}'
        values: '4+0x20'
      - series: 'noviis_scheduler_pool_queued{pool="common"}'
        values: '1+1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: NoviIsSchedulerPoolBacklogGrowing
        exp_alerts: []
      - eval_time: 11m
        alertname: NoviIsSchedulerPoolBacklogGrowing
        exp_alerts:
          - exp_labels:
              pool: common
              severity: warning
            exp_annotations:
              summary: "Scheduler pool common is saturated while its queue is growing"
              description: "The queue includes future scheduled executions, so this alert requires both full worker utilization and sustained queue growth."

  - name: asynchronous rejection outcomes keep distinct severities
    interval: 1m
    input_series:
      - series: 'noviis_async_rejected_total{executor="durable",outcome="exception"}'
        values: '0 1+0x6'
      - series: 'noviis_async_rejected_total{executor="notification",outcome="exception"}'
        values: '0 1+0x6'
      - series: 'noviis_async_rejected_total{executor="observability",outcome="dropped"}'
        values: '0 1+0x6'
    alert_rule_test:
      - eval_time: 2m
        alertname: NoviIsAsyncDurableRejected
        exp_alerts:
          - exp_labels:
              executor: durable
              outcome: exception
              severity: critical
            exp_annotations:
              summary: "A durable asynchronous task was rejected"
      - eval_time: 2m
        alertname: NoviIsAsyncNotificationRejected
        exp_alerts:
          - exp_labels:
              executor: notification
              outcome: exception
              severity: warning
            exp_annotations:
              summary: "A notification asynchronous task was rejected"
      - eval_time: 2m
        alertname: NoviIsAsyncObservabilityDropped
        exp_alerts:
          - exp_labels:
              executor: observability
              outcome: dropped
              severity: warning
            exp_annotations:
              summary: "An observability asynchronous task was dropped"

  - name: asynchronous executor saturation requires sustained active work
    interval: 1m
    input_series:
      - series: 'noviis_async_active{executor="notification"}'
        values: '4+0x8'
      - series: 'noviis_async_queue_remaining{executor="notification"}'
        values: '0+0x8'
    alert_rule_test:
      - eval_time: 5m
        alertname: NoviIsAsyncExecutorSaturated
        exp_alerts:
          - exp_labels:
              executor: notification
              severity: warning
            exp_annotations:
              summary: "Async executor notification has no queue capacity remaining"

  - name: enabled host exporter and filesystem headroom are monitored
    interval: 1m
    input_series:
      - series: 'up{job="noviis-host",monitoring="enabled",instance="127.0.0.1:9100"}'
        values: '0+0x20'
      - series: 'node_filesystem_avail_bytes{job="noviis-host",mountpoint="/",fstype="ext4"}'
        values: '100+0x20'
      - series: 'node_filesystem_size_bytes{job="noviis-host",mountpoint="/",fstype="ext4"}'
        values: '1000+0x20'
      - series: 'node_filesystem_files_free{job="noviis-host",mountpoint="/",fstype="ext4"}'
        values: '50+0x20'
      - series: 'node_filesystem_files{job="noviis-host",mountpoint="/",fstype="ext4"}'
        values: '1000+0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: NoviIsHostExporterDown
        exp_alerts:
          - exp_labels:
              instance: 127.0.0.1:9100
              job: noviis-host
              monitoring: enabled
              severity: critical
            exp_annotations:
              summary: "The enabled NoviIs host exporter is unavailable"
      - eval_time: 15m
        alertname: NoviIsHostDiskFreeLow
        exp_alerts:
          - exp_labels:
              fstype: ext4
              job: noviis-host
              mountpoint: /
              severity: warning
            exp_annotations:
              summary: "The NoviIs host root filesystem has less than 15 percent free space"
      - eval_time: 15m
        alertname: NoviIsHostInodesFreeLow
        exp_alerts:
          - exp_labels:
              fstype: ext4
              job: noviis-host
              mountpoint: /
              severity: warning
            exp_annotations:
              summary: "The NoviIs host root filesystem has less than 10 percent free inodes"

  - name: host monitoring contract detects a removed exporter target
    interval: 1m
    input_series:
      - series: 'up{job="noviis-host-contract",monitoring="expected",instance="127.0.0.1:9090"}'
        values: '1+0x8'
    alert_rule_test:
      - eval_time: 5m
        alertname: NoviIsHostTargetMissing
        exp_alerts:
          - exp_labels:
              instance: 127.0.0.1:9090
              job: noviis-host-contract
              monitoring: expected
              severity: critical
            exp_annotations:
              summary: "Host monitoring is expected but the exporter target is missing"

  - name: host exporter without root filesystem metrics is incomplete
    interval: 1m
    input_series:
      - series: 'up{job="noviis-host",monitoring="enabled",instance="127.0.0.1:9100"}'
        values: '1+0x8'
    alert_rule_test:
      - eval_time: 5m
        alertname: NoviIsHostFilesystemMetricMissing
        exp_alerts:
          - exp_labels:
              instance: 127.0.0.1:9100
              job: noviis-host
              monitoring: enabled
              severity: critical
            exp_annotations:
              summary: "The host exporter is up but root filesystem metrics are missing"

  - name: declining host disk is predicted before exhaustion
    interval: 30m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="noviis-host",mountpoint="/",fstype="ext4"}'
        values: '700-50x16'
    alert_rule_test:
      - eval_time: 8h
        alertname: NoviIsHostDiskWillFillWithin24Hours
        exp_alerts:
          - exp_labels:
              fstype: ext4
              job: noviis-host
              mountpoint: /
              severity: warning
            exp_annotations:
              summary: "The NoviIs host root filesystem is predicted to fill within 24 hours"

  - name: Web Push delivery and cleanup failures are observable
    interval: 1m
    input_series:
      - series: 'noviis_webpush_delivery_total{outcome="success"}'
        values: '0+18x20'
      - series: 'noviis_webpush_delivery_total{outcome="retryable_failure"}'
        values: '0+2x20'
      - series: 'noviis_webpush_delivery_total{outcome="timeout"}'
        values: '0+1x20'
      - series: 'noviis_webpush_subscription_cleanup_total{outcome="failure"}'
        values: '0 0 1+0x18'
    alert_rule_test:
      - eval_time: 11m
        alertname: NoviIsWebPushDeliveryFailureHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Web Push failures exceeded 10 percent with at least 20 delivery attempts"
      - eval_time: 2m
        alertname: NoviIsWebPushCleanupFailure
        exp_alerts:
          - exp_labels:
              outcome: failure
              severity: warning
            exp_annotations:
              summary: "Expired Web Push subscription cleanup failed"

  - name: durable Web Push backlog and dead letters are actionable
    interval: 1m
    input_series:
      - series: 'noviis_webpush_job_backlog{status="pending"}'
        values: '101+0x20'
      - series: 'noviis_webpush_job_backlog{status="failed"}'
        values: '1+0x20'
      - series: 'noviis_webpush_job_oldest_age_seconds'
        values: '360+0x20'
      - series: 'noviis_webpush_job_outcome_total{outcome="dead_letter"}'
        values: '0 1+0x19'
    alert_rule_test:
      - eval_time: 11m
        alertname: NoviIsWebPushJobBacklog
        exp_alerts:
          - exp_labels: { status: pending, severity: warning }
            exp_annotations: { summary: "Durable Web Push delivery is not keeping pace" }
          - exp_labels: { severity: warning }
            exp_annotations: { summary: "Durable Web Push delivery is not keeping pace" }
      - eval_time: 1m
        alertname: NoviIsWebPushJobFailed
        exp_alerts:
          - exp_labels: { status: failed, severity: critical }
            exp_annotations: { summary: "A durable Web Push job exhausted all retries" }
      - eval_time: 2m
        alertname: NoviIsWebPushJobDeadLetter
        exp_alerts:
          - exp_labels: { outcome: dead_letter, severity: critical }
            exp_annotations: { summary: "A Web Push job entered the dead letter state" }

  - name: durable notification backlog and dead letters are observable
    interval: 1m
    input_series:
      - series: 'noviis_notification_delivery_jobs_pending'
        values: '101+0x15'
      - series: 'noviis_notification_delivery_jobs_dead_letter'
        values: '1+0x15'
      - series: 'noviis_notification_delivery_jobs_oldest_due_age_seconds'
        values: '360+0x15'
      - series: 'noviis_notification_delivery_jobs_oldest_lease_age_seconds'
        values: '180+0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: NoviIsNotificationDeliveryBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Durable notification delivery has more than 100 pending jobs"
      - eval_time: 2m
        alertname: NoviIsNotificationDeliveryDeadLetter
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "A durable notification delivery exhausted all retries"
      - eval_time: 5m
        alertname: NoviIsNotificationDeliveryOldestDueStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The oldest due notification delivery has waited more than five minutes"
      - eval_time: 2m
        alertname: NoviIsNotificationDeliveryLeaseStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "A notification delivery lease has remained active for more than two minutes"

  - name: feed generation backlog and exhausted retries are observable
    interval: 1m
    input_series:
      - series: 'noviis_feed_generation_jobs_pending'
        values: '101+0x20'
      - series: 'noviis_feed_generation_jobs_oldest_pending_age_seconds'
        values: '360+0x20'
      - series: 'noviis_feed_generation_jobs_failed'
        values: '1+0x20'
      - series: 'noviis_feed_generation_jobs_processed_total{result="dead_letter"}'
        values: '0 1+0x19'
      - series: 'noviis_feed_generation_jobs_processed_total{result="redrive"}'
        values: '0 1+0x19'
    alert_rule_test:
      - eval_time: 10m
        alertname: NoviIsFeedGenerationBacklog
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: { summary: "Feed generation has more than 100 pending jobs" }
      - eval_time: 5m
        alertname: NoviIsFeedGenerationOldestPendingStale
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: { summary: "The oldest feed generation job has waited more than five minutes" }
      - eval_time: 2m
        alertname: NoviIsFeedGenerationFailed
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "A feed generation job exhausted all retries" }
      - eval_time: 2m
        alertname: NoviIsFeedGenerationDeadLetter
        exp_alerts:
          - exp_labels:
              result: dead_letter
              severity: critical
            exp_annotations: { summary: "Feed generation moved a job to the dead letter state" }

  - name: small durable maintenance queues alert by age and dead letter
    interval: 1m
    input_series:
      - series: 'noviis_notification_keyword_fanout_jobs_oldest_due_age_seconds'
        values: '360+0x20'
      - series: 'noviis_notification_keyword_fanout_jobs_dead_letter'
        values: '1+0x20'
      - series: 'noviis_notification_keyword_fanout_jobs_total{outcome="retry"}'
        values: '0+2x20'
      - series: 'noviis_file_variant_cleanup_oldest_due_age_seconds'
        values: '1000+0x20'
      - series: 'noviis_file_variant_cleanup_dead_letter'
        values: '1+0x20'
      - series: 'noviis_file_variant_cleanup_total{outcome="retry"}'
        values: '0+2x20'
      - series: 'noviis_semantic_reindex_jobs_oldest_active_age_seconds'
        values: '1000+0x20'
      - series: 'noviis_semantic_reindex_jobs_failed'
        values: '1+0x20'
      - series: 'noviis_semantic_reindex_jobs_processed_total{result="dead_letter"}'
        values: '0 1+0x19'
      - series: 'noviis_semantic_reindex_jobs_processed_total{result="redrive"}'
        values: '0 1+0x19'
    alert_rule_test:
      - eval_time: 5m
        alertname: NoviIsKeywordFanoutStale
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: { summary: "The oldest keyword notification fan-out has waited more than five minutes" }
      - eval_time: 2m
        alertname: NoviIsKeywordFanoutDeadLetter
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "A keyword notification fan-out exhausted all retries" }
      - eval_time: 15m
        alertname: NoviIsKeywordFanoutRetrySurge
        exp_alerts:
          - exp_labels:
              outcome: retry
              severity: warning
            exp_annotations: { summary: "Keyword notification fan-out retries exceeded 20 in 15 minutes" }
      - eval_time: 5m
        alertname: NoviIsFileVariantCleanupStale
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: { summary: "An image variant cleanup has remained due for more than 15 minutes" }
      - eval_time: 2m
        alertname: NoviIsFileVariantCleanupDeadLetter
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "An image variant cleanup exhausted all retries" }
      - eval_time: 15m
        alertname: NoviIsFileVariantCleanupRetrySurge
        exp_alerts:
          - exp_labels:
              outcome: retry
              severity: warning
            exp_annotations: { summary: "Image variant cleanup retries exceeded 20 in 15 minutes" }
      - eval_time: 5m
        alertname: NoviIsSemanticReindexStale
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: { summary: "A semantic reindex cursor job has remained active for more than 15 minutes" }
      - eval_time: 2m
        alertname: NoviIsSemanticReindexFailed
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "A semantic reindex job exhausted all retries" }
      - eval_time: 2m
        alertname: NoviIsSemanticReindexDeadLetter
        exp_alerts:
          - exp_labels:
              result: dead_letter
              severity: critical
            exp_annotations: { summary: "Semantic reindexing moved a job to the dead letter state" }

  - name: process start time change reports a restart
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{instance="localhost:8081",job="noviis-backend"}'
        values: '0+0x4 300+0x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: NoviIsProcessRestarted
        exp_alerts:
          - exp_labels:
              instance: localhost:8081
              job: noviis-backend
              severity: info
            exp_annotations:
              summary: "The NoviIs backend process restarted within the last 15 minutes"

  - name: deployment cleanup debt persists beyond the operator grace period
    interval: 1m
    input_series:
      - series: 'noviis_deployment_cleanup_debt{component="backend",debt="release_retention"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: NoviIsDeploymentCleanupDebt
        exp_alerts:
          - exp_labels:
              component: backend
              debt: release_retention
              severity: warning
            exp_annotations:
              summary: "Deployment cleanup debt remains for backend: release_retention"

  - name: incoming release cleanup reconciliation exposes orphan count and age
    interval: 1m
    input_series:
      - series: 'noviis_deployment_incoming_orphans{component="frontend"}'
        values: '2+0x20'
      - series: 'noviis_deployment_incoming_orphan_oldest_age_seconds{component="frontend"}'
        values: '7200+0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: NoviIsDeploymentIncomingOrphans
        exp_alerts:
          - exp_labels:
              component: frontend
              severity: warning
            exp_annotations:
              summary: "Incoming release directories remain for frontend"
      - eval_time: 15m
        alertname: NoviIsDeploymentIncomingOrphanOld
        exp_alerts:
          - exp_labels:
              component: frontend
              severity: critical
            exp_annotations:
              summary: "The oldest incoming release for frontend is over one hour old"

  - name: deployment cleanup metric writers are required and freshness checked
    interval: 1m
    input_series:
      - series: 'noviis_deployment_cleanup_writer_success_timestamp_seconds{component="backend",debt="incoming_release"}'
        values: '0+0x50'
      - series: 'noviis_deployment_cleanup_debt{component="backend",debt="incoming_release"}'
        values: '1+0x50'
    alert_rule_test:
      - eval_time: 15m
        alertname: NoviIsDeploymentCleanupMetricMissing
        exp_alerts:
          - exp_labels: { component: backend, debt: release_retention, severity: warning }
            exp_annotations: { summary: "Deployment cleanup metrics are missing for backend: release_retention" }
          - exp_labels: { component: backend, debt: status_diagnostic, severity: warning }
            exp_annotations: { summary: "Deployment cleanup metrics are missing for backend: status_diagnostic" }
          - exp_labels: { component: frontend, debt: release_retention, severity: warning }
            exp_annotations: { summary: "Deployment cleanup metrics are missing for frontend: release_retention" }
          - exp_labels: { component: frontend, debt: incoming_release, severity: warning }
            exp_annotations: { summary: "Deployment cleanup metrics are missing for frontend: incoming_release" }
          - exp_labels: { component: frontend, debt: seo_submission, severity: warning }
            exp_annotations: { summary: "Deployment cleanup metrics are missing for frontend: seo_submission" }
      - eval_time: 47m
        alertname: NoviIsDeploymentCleanupMetricStale
        exp_alerts:
          - exp_labels: { component: backend, debt: incoming_release, severity: warning }
            exp_annotations: { summary: "Deployment cleanup metrics are stale for backend: incoming_release" }

  - name: Prometheus restart is not reported as a backend restart
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{instance="localhost:9090",job="prometheus"}'
        values: '0+0x4 300+0x15'
      - series: 'process_start_time_seconds{instance="localhost:8081",job="noviis-backend"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: NoviIsProcessRestarted
        exp_alerts: []
