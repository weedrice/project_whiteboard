groups:
  - name: noviis
    rules:
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(600)
        labels: { cadence: frequent, scheduled_job: FeedGenerationJobScheduler.processPendingFeedGenerationJobs, threshold: 10m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(600)
        labels: { cadence: frequent, scheduled_job: FileDeletionScheduler.processPendingDeletions, threshold: 10m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(600)
        labels: { cadence: frequent, scheduled_job: MqueueScheduler.processMessageQueue, threshold: 10m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(600)
        labels: { cadence: frequent, scheduled_job: NotificationSseEmitterRegistry.sendHeartbeat, threshold: 10m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(600)
        labels: { cadence: frequent, scheduled_job: ScheduledPostPublisherScheduler.publishDuePosts, threshold: 10m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(600)
        labels: { cadence: frequent, scheduled_job: SemanticSearchJobMetrics.refresh, threshold: 10m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(600)
        labels: { cadence: frequent, scheduled_job: SemanticSearchJobScheduler.processPendingSemanticSearchJobs, threshold: 10m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(8100)
        labels: { cadence: hourly, scheduled_job: AgentPendingClaimCleanupScheduler.cleanupExpiredPendingClaims, threshold: 2h15m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(8100)
        labels: { cadence: hourly, scheduled_job: OAuthSignupTicketCleanupScheduler.deleteExpiredTickets, threshold: 2h15m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(8100)
        labels: { cadence: hourly, scheduled_job: PopularPostScheduler.aggregatePopularPosts, threshold: 2h15m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(108000)
        labels: { cadence: daily, scheduled_job: ErrorLogCleanupScheduler.cleanupExpiredLogs, threshold: 30h }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(108000)
        labels: { cadence: daily, scheduled_job: FileCleanupScheduler.cleanupTemporaryFiles, threshold: 30h }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(108000)
        labels: { cadence: daily, scheduled_job: PostDraftCleanupScheduler.cleanupExpiredDrafts, threshold: 30h }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(108000)
        labels: { cadence: daily, scheduled_job: TagCleanupScheduler.cleanupOrphanTags, threshold: 30h }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(108000)
        labels: { cadence: daily, scheduled_job: UserFeedCleanupScheduler.cleanupHardStalePostFeeds, threshold: 30h }

      - alert: NoviIsBackendDown
        expr: up{job="noviis-backend"} == 0 or absent(up{job="noviis-backend"})
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "NoviIs backend metrics scrape has failed for 2 minutes" }
      - alert: NoviIsPrometheusSelfScrapeDown
        expr: up{job="prometheus"} == 0 or absent(up{job="prometheus"})
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Prometheus has failed to scrape its own metrics for 2 minutes" }
      - alert: NoviIsPrometheusRuleEvaluationFailure
        expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
        labels: { severity: critical }
        annotations: { summary: "Prometheus recorded a rule evaluation failure" }
      - alert: NoviIsPrometheusConfigReloadFailure
        expr: prometheus_config_last_reload_successful != 1
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Prometheus configuration reload is failing" }
      - alert: NoviIsPrometheusTsdbFailure
        expr: >-
          increase(prometheus_tsdb_wal_corruptions_total[5m]) > 0
          or increase(prometheus_tsdb_head_truncations_failed_total[5m]) > 0
          or increase(prometheus_tsdb_compactions_failed_total[5m]) > 0
          or increase(prometheus_tsdb_checkpoint_creations_failed_total[5m]) > 0
        labels: { severity: critical }
        annotations: { summary: "Prometheus TSDB recorded a persistence failure" }
      - alert: NoviIsRequiredBackendMetricMissing
        expr: >-
          (
            label_replace(absent(noviis_sse_heartbeat_gap_seconds), "missing_metric", "noviis_sse_heartbeat_gap_seconds", "", "")
            or label_replace(absent(noviis_semantic_jobs_pending), "missing_metric", "noviis_semantic_jobs_pending", "", "")
            or label_replace(absent(noviis_semantic_jobs_oldest_age_seconds), "missing_metric", "noviis_semantic_jobs_oldest_age_seconds", "", "")
            or label_replace(absent(jvm_memory_used_bytes{area="heap"}), "missing_metric", "jvm_memory_used_bytes", "", "")
            or label_replace(absent(hikaricp_connections_max), "missing_metric", "hikaricp_connections_max", "", "")
          )
          and on() (max(time() - process_start_time_seconds{job="noviis-backend"}) > 600)
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Required backend metric {{ $labels.missing_metric }} is missing"
          description: "The backend has been up for more than 10 minutes without exporting this required metric."
      - alert: NoviIsScheduledJobFailure
        expr: increase(noviis_scheduler_execution_seconds_count{outcome="error"}[5m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "Scheduled job {{ $labels.scheduled_job }} failed"
          description: "The scheduled job {{ $labels.scheduled_job }} recorded an error outcome."
      - alert: NoviIsScheduledJobStale
        expr: >-
          (
            time() - noviis_scheduler_last_success_timestamp_seconds
            > on(scheduled_job) group_left(cadence, threshold)
              noviis_scheduler_expected_max_age_seconds
          )
          or
          (
            (
              noviis_scheduler_expected_max_age_seconds
              unless on(scheduled_job) noviis_scheduler_last_success_timestamp_seconds
            )
            < on() group_left
              (time() - process_start_time_seconds)
          )
        labels: { severity: warning }
        annotations:
          summary: "Scheduled job {{ $labels.scheduled_job }} has no recent success"
          description: "No successful completion was observed within the configured {{ $labels.threshold }} threshold for this {{ $labels.cadence }} job."
      - alert: NoviIsHeartbeatDelayed
        expr: >-
          noviis_sse_heartbeat_gap_seconds > 40
          or
          (
            noviis_sse_heartbeat_gap_seconds == 0
            and on() (max(time() - process_start_time_seconds) > 40)
          )
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "SSE heartbeat has not run within 40 seconds" }
      - alert: NoviIsSemanticBacklogOld
        expr: noviis_semantic_jobs_oldest_age_seconds > 300
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "The oldest semantic search job has waited over 5 minutes" }
      - alert: NoviIsJvmHeapHigh
        expr: sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "JVM heap usage has exceeded 85 percent" }
      - alert: NoviIsHttp5xxRateHigh
        expr: >-
          sum(increase(http_server_requests_seconds_count{status=~"5.."}[5m]))
          / clamp_min(sum(increase(http_server_requests_seconds_count[5m])), 1) > 0.05
          and sum(increase(http_server_requests_seconds_count[5m])) >= 20
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "HTTP 5xx responses exceeded 5 percent for 10 minutes with at least 20 requests per 5 minutes" }
      - alert: NoviIsHttpP95LatencyHigh
        expr: >-
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 1
          and sum(increase(http_server_requests_seconds_count[5m])) >= 20
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "HTTP server p95 latency exceeded 1 second for 10 minutes with at least 20 requests per 5 minutes" }
      - alert: NoviIsHikariPoolSaturated
        expr: >-
          sum(hikaricp_connections_active)
          / clamp_min(sum(hikaricp_connections_max), 1) > 0.85
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "HikariCP active connections exceeded 85 percent of the configured maximum for 10 minutes" }
      - alert: NoviIsSchedulerPoolBacklogGrowing
        expr: >-
          max by (pool) (noviis_scheduler_pool_active)
          >= max by (pool) (noviis_scheduler_pool_size)
          and on(pool) deriv(noviis_scheduler_pool_queued[10m]) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Scheduler pool {{ $labels.pool }} is saturated while its queue is growing"
          description: "The queue includes future scheduled executions, so this alert requires both full worker utilization and sustained queue growth."
      - alert: NoviIsWebPushDeliveryFailureHigh
        expr: >-
          sum(increase(noviis_webpush_delivery_total{outcome=~"failure|timeout"}[15m]))
          / clamp_min(sum(increase(noviis_webpush_delivery_total[15m])), 1) > 0.10
          and sum(increase(noviis_webpush_delivery_total[15m])) >= 20
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Web Push failures exceeded 10 percent with at least 20 delivery attempts" }
      - alert: NoviIsWebPushCleanupFailure
        expr: increase(noviis_webpush_subscription_cleanup_total{outcome="failure"}[15m]) > 0
        labels: { severity: warning }
        annotations: { summary: "Expired Web Push subscription cleanup failed" }
      - alert: NoviIsProcessRestarted
        expr: changes(process_start_time_seconds[15m]) > 0
        labels: { severity: info }
        annotations: { summary: "The NoviIs backend process restarted within the last 15 minutes" }
      - alert: NoviIsAgentPurgeBacklog
        expr: noviis_agent_pending_claim_purge_eligible > 5000
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "More than 5000 pending agent rows await purge" }
      - alert: NoviIsSensitiveRateLimitSurge
        expr: sum(increase(noviis_ratelimit_rejected_total{tier=~"auth|agent-register|public-log"}[5m])) > 20
        labels: { severity: warning }
        annotations: { summary: "Sensitive unauthenticated endpoints are being rate limited heavily" }
