groups:
  - name: noviis
    rules:
      - record: noviis_deployment_cleanup_expected
        expr: vector(1)
        labels: { component: backend, debt: release_retention }
      - record: noviis_deployment_cleanup_expected
        expr: vector(1)
        labels: { component: backend, debt: incoming_release }
      - record: noviis_deployment_cleanup_expected
        expr: vector(1)
        labels: { component: backend, debt: status_diagnostic }
      - record: noviis_deployment_cleanup_expected
        expr: vector(1)
        labels: { component: frontend, debt: release_retention }
      - record: noviis_deployment_cleanup_expected
        expr: vector(1)
        labels: { component: frontend, debt: incoming_release }
      - record: noviis_deployment_cleanup_expected
        expr: vector(1)
        labels: { component: frontend, debt: seo_submission }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(600)
        labels: { cadence: frequent, scheduled_job: FeedGenerationJobScheduler.processPendingFeedGenerationJobs, threshold: 10m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(600)
        labels: { cadence: frequent, scheduled_job: FileDeletionScheduler.processPendingDeletions, threshold: 10m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(600)
        labels: { cadence: frequent, scheduled_job: MqueueScheduler.processMessageQueue, threshold: 10m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(600)
        labels: { cadence: frequent, scheduled_job: NotificationDeliveryJobScheduler.processPendingJobs, threshold: 10m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(600)
        labels: { cadence: frequent, scheduled_job: NotificationSseEmitterRegistry.sendHeartbeat, threshold: 10m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(600)
        labels: { cadence: frequent, scheduled_job: PushDeliveryJobScheduler.processPendingJobs, threshold: 10m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(600)
        labels: { cadence: frequent, scheduled_job: ScheduledPostPublisherScheduler.publishDuePosts, threshold: 10m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(600)
        labels: { cadence: frequent, scheduled_job: SemanticSearchJobMetrics.refresh, threshold: 10m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(600)
        labels: { cadence: frequent, scheduled_job: SemanticSearchJobScheduler.processPendingSemanticSearchJobs, threshold: 10m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(8100)
        labels: { cadence: hourly, scheduled_job: AgentPendingClaimCleanupScheduler.cleanupExpiredPendingClaims, threshold: 2h15m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(8100)
        labels: { cadence: hourly, scheduled_job: OAuthSignupTicketCleanupScheduler.deleteExpiredTickets, threshold: 2h15m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(8100)
        labels: { cadence: hourly, scheduled_job: FileVariantCleanupScheduler.cleanupStaleVariants, threshold: 2h15m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(8100)
        labels: { cadence: hourly, scheduled_job: PopularPostScheduler.aggregatePopularPosts, threshold: 2h15m }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(108000)
        labels: { cadence: daily, scheduled_job: ErrorLogCleanupScheduler.cleanupExpiredLogs, threshold: 30h }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(108000)
        labels: { cadence: daily, scheduled_job: FileCleanupScheduler.cleanupTemporaryFiles, threshold: 30h }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(108000)
        labels: { cadence: daily, scheduled_job: LoginHistoryCleanupScheduler.cleanupExpiredLoginHistories, threshold: 30h }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(108000)
        labels: { cadence: daily, scheduled_job: PostDraftCleanupScheduler.cleanupExpiredDrafts, threshold: 30h }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(108000)
        labels: { cadence: daily, scheduled_job: RefreshTokenCleanupScheduler.cleanupExpiredRefreshTokens, threshold: 30h }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(108000)
        labels: { cadence: daily, scheduled_job: TagCleanupScheduler.cleanupOrphanTags, threshold: 30h }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(108000)
        labels: { cadence: daily, scheduled_job: UserFeedCleanupScheduler.cleanupHardStalePostFeeds, threshold: 30h }
      - record: noviis_scheduler_expected_max_age_seconds
        expr: vector(108000)
        labels: { cadence: daily, scheduled_job: VerificationCodeCleanupScheduler.cleanupExpiredVerificationCodes, threshold: 30h }

      - alert: NoviIsBackendDown
        expr: up{job="noviis-backend"} == 0 or absent(up{job="noviis-backend"})
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "NoviIs backend metrics scrape has failed for 2 minutes" }
      - alert: NoviIsPrometheusSelfScrapeDown
        expr: up{job="prometheus"} == 0 or absent(up{job="prometheus"})
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Prometheus has failed to scrape its own metrics for 2 minutes" }
      - alert: NoviIsPrometheusRuleEvaluationFailure
        expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
        labels: { severity: critical }
        annotations: { summary: "Prometheus recorded a rule evaluation failure" }
      - alert: NoviIsPrometheusConfigReloadFailure
        expr: prometheus_config_last_reload_successful != 1
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Prometheus configuration reload is failing" }
      - alert: NoviIsPrometheusTsdbFailure
        expr: >-
          increase(prometheus_tsdb_wal_corruptions_total[5m]) > 0
          or increase(prometheus_tsdb_head_truncations_failed_total[5m]) > 0
          or increase(prometheus_tsdb_compactions_failed_total[5m]) > 0
          or increase(prometheus_tsdb_checkpoint_creations_failed_total[5m]) > 0
        labels: { severity: critical }
        annotations: { summary: "Prometheus TSDB recorded a persistence failure" }
      - alert: NoviIsRequiredBackendMetricMissing
        expr: >-
          (
            label_replace(absent(noviis_sse_heartbeat_gap_seconds), "missing_metric", "noviis_sse_heartbeat_gap_seconds", "", "")
            or label_replace(absent(noviis_semantic_jobs_pending), "missing_metric", "noviis_semantic_jobs_pending", "", "")
            or label_replace(absent(noviis_semantic_jobs_oldest_age_seconds), "missing_metric", "noviis_semantic_jobs_oldest_age_seconds", "", "")
            or label_replace(absent(jvm_memory_used_bytes{job="noviis-backend",area="heap"}), "missing_metric", "jvm_memory_used_bytes", "", "")
            or label_replace(absent(hikaricp_connections_max{job="noviis-backend"}), "missing_metric", "hikaricp_connections_max", "", "")
            or label_replace(absent(noviis_async_active), "missing_metric", "noviis_async_active", "", "")
            or label_replace(absent(noviis_async_queue_depth), "missing_metric", "noviis_async_queue_depth", "", "")
            or label_replace(absent(noviis_async_queue_remaining), "missing_metric", "noviis_async_queue_remaining", "", "")
            or label_replace(absent(noviis_async_rejected_total), "missing_metric", "noviis_async_rejected_total", "", "")
            or label_replace(absent(noviis_feed_generation_jobs_pending), "missing_metric", "noviis_feed_generation_jobs_pending", "", "")
            or label_replace(absent(noviis_feed_generation_jobs_processing), "missing_metric", "noviis_feed_generation_jobs_processing", "", "")
            or label_replace(absent(noviis_feed_generation_jobs_failed), "missing_metric", "noviis_feed_generation_jobs_failed", "", "")
            or label_replace(absent(noviis_feed_generation_jobs_oldest_pending_age_seconds), "missing_metric", "noviis_feed_generation_jobs_oldest_pending_age_seconds", "", "")
            or label_replace(absent(noviis_feed_generation_jobs_processed_total), "missing_metric", "noviis_feed_generation_jobs_processed_total", "", "")
            or label_replace(absent(noviis_notification_delivery_jobs_pending), "missing_metric", "noviis_notification_delivery_jobs_pending", "", "")
            or label_replace(absent(noviis_notification_delivery_jobs_dead_letter), "missing_metric", "noviis_notification_delivery_jobs_dead_letter", "", "")
            or label_replace(absent(noviis_notification_delivery_jobs_oldest_due_age_seconds), "missing_metric", "noviis_notification_delivery_jobs_oldest_due_age_seconds", "", "")
            or label_replace(absent(noviis_notification_delivery_jobs_oldest_lease_age_seconds), "missing_metric", "noviis_notification_delivery_jobs_oldest_lease_age_seconds", "", "")
            or label_replace(absent(noviis_notification_keyword_fanout_jobs_pending), "missing_metric", "noviis_notification_keyword_fanout_jobs_pending", "", "")
            or label_replace(absent(noviis_notification_keyword_fanout_jobs_dead_letter), "missing_metric", "noviis_notification_keyword_fanout_jobs_dead_letter", "", "")
            or label_replace(absent(noviis_notification_keyword_fanout_jobs_oldest_due_age_seconds), "missing_metric", "noviis_notification_keyword_fanout_jobs_oldest_due_age_seconds", "", "")
            or label_replace(absent(noviis_notification_keyword_fanout_jobs_total), "missing_metric", "noviis_notification_keyword_fanout_jobs_total", "", "")
            or label_replace(absent(noviis_file_variant_cleanup_dead_letter), "missing_metric", "noviis_file_variant_cleanup_dead_letter", "", "")
            or label_replace(absent(noviis_file_variant_cleanup_oldest_due_age_seconds), "missing_metric", "noviis_file_variant_cleanup_oldest_due_age_seconds", "", "")
            or label_replace(absent(noviis_file_variant_cleanup_total), "missing_metric", "noviis_file_variant_cleanup_total", "", "")
            or label_replace(absent(noviis_semantic_reindex_jobs_pending), "missing_metric", "noviis_semantic_reindex_jobs_pending", "", "")
            or label_replace(absent(noviis_semantic_reindex_jobs_processing), "missing_metric", "noviis_semantic_reindex_jobs_processing", "", "")
            or label_replace(absent(noviis_semantic_reindex_jobs_oldest_active_age_seconds), "missing_metric", "noviis_semantic_reindex_jobs_oldest_active_age_seconds", "", "")
            or label_replace(absent(noviis_semantic_reindex_jobs_failed), "missing_metric", "noviis_semantic_reindex_jobs_failed", "", "")
            or label_replace(absent(noviis_semantic_reindex_jobs_processed_total), "missing_metric", "noviis_semantic_reindex_jobs_processed_total", "", "")
            or label_replace(absent(noviis_webpush_job_backlog), "missing_metric", "noviis_webpush_job_backlog", "", "")
            or label_replace(absent(noviis_webpush_job_oldest_age_seconds), "missing_metric", "noviis_webpush_job_oldest_age_seconds", "", "")
            or label_replace(absent(noviis_webpush_job_outcome_total), "missing_metric", "noviis_webpush_job_outcome_total", "", "")
          )
          and on() (max(time() - process_start_time_seconds{job="noviis-backend"}) > 600)
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Required backend metric {{ $labels.missing_metric }} is missing"
          description: "The backend has been up for more than 10 minutes without exporting this required metric."
      - alert: NoviIsScheduledJobFailure
        expr: increase(noviis_scheduler_execution_seconds_count{outcome="error"}[5m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "Scheduled job {{ $labels.scheduled_job }} failed"
          description: "The scheduled job {{ $labels.scheduled_job }} recorded an error outcome."
      - alert: NoviIsScheduledJobStale
        expr: >-
          (
            time() - noviis_scheduler_last_success_timestamp_seconds
            > on(scheduled_job) group_left(cadence, threshold)
              noviis_scheduler_expected_max_age_seconds
          )
          or
          (
            (
              noviis_scheduler_expected_max_age_seconds
              unless on(scheduled_job) noviis_scheduler_last_success_timestamp_seconds
            )
            < on() group_left()
              (time() - process_start_time_seconds{job="noviis-backend"})
          )
        labels: { severity: warning }
        annotations:
          summary: "Scheduled job {{ $labels.scheduled_job }} has no recent success"
          description: "No successful completion was observed within the configured {{ $labels.threshold }} threshold for this {{ $labels.cadence }} job."
      - alert: NoviIsHeartbeatDelayed
        expr: >-
          noviis_sse_heartbeat_gap_seconds > 40
          or
          (
            noviis_sse_heartbeat_gap_seconds == 0
            and on() (max(time() - process_start_time_seconds{job="noviis-backend"}) > 40)
          )
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "SSE heartbeat has not run within 40 seconds" }
      - alert: NoviIsSemanticBacklogOld
        expr: noviis_semantic_jobs_oldest_age_seconds > 300
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "The oldest semantic search job has waited over 5 minutes" }
      - alert: NoviIsJvmHeapHigh
        expr: sum(jvm_memory_used_bytes{job="noviis-backend",area="heap"}) / sum(jvm_memory_max_bytes{job="noviis-backend",area="heap"}) > 0.85
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "JVM heap usage has exceeded 85 percent" }
      - alert: NoviIsHttp5xxRateHigh
        expr: >-
          sum(increase(http_server_requests_seconds_count{job="noviis-backend",status=~"5.."}[5m]))
          / clamp_min(sum(increase(http_server_requests_seconds_count{job="noviis-backend"}[5m])), 1) > 0.05
          and sum(increase(http_server_requests_seconds_count{job="noviis-backend"}[5m])) >= 20
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "HTTP 5xx responses exceeded 5 percent for 10 minutes with at least 20 requests per 5 minutes" }
      - alert: NoviIsHttpP95LatencyHigh
        expr: >-
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="noviis-backend"}[5m]))
          ) > 1
          and sum(increase(http_server_requests_seconds_count{job="noviis-backend"}[5m])) >= 20
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "HTTP server p95 latency exceeded 1 second for 10 minutes with at least 20 requests per 5 minutes" }
      - alert: NoviIsHikariPoolSaturated
        expr: >-
          sum(hikaricp_connections_active{job="noviis-backend"})
          / clamp_min(sum(hikaricp_connections_max{job="noviis-backend"}), 1) > 0.85
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "HikariCP active connections exceeded 85 percent of the configured maximum for 10 minutes" }
      - alert: NoviIsSchedulerPoolBacklogGrowing
        expr: >-
          max by (pool) (noviis_scheduler_pool_active)
          >= max by (pool) (noviis_scheduler_pool_size)
          and on(pool) deriv(noviis_scheduler_pool_queued[10m]) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Scheduler pool {{ $labels.pool }} is saturated while its queue is growing"
          description: "The queue includes future scheduled executions, so this alert requires both full worker utilization and sustained queue growth."
      - alert: NoviIsAsyncDurableRejected
        expr: increase(noviis_async_rejected_total{executor="durable",outcome="exception"}[5m]) > 0
        labels: { severity: critical }
        annotations: { summary: "A durable asynchronous task was rejected" }
      - alert: NoviIsAsyncNotificationRejected
        expr: increase(noviis_async_rejected_total{executor="notification",outcome="exception"}[5m]) > 0
        labels: { severity: warning }
        annotations: { summary: "A notification asynchronous task was rejected" }
      - alert: NoviIsAsyncObservabilityDropped
        expr: increase(noviis_async_rejected_total{executor="observability",outcome="dropped"}[5m]) > 0
        labels: { severity: warning }
        annotations: { summary: "An observability asynchronous task was dropped" }
      - alert: NoviIsAsyncExecutorSaturated
        expr: >-
          noviis_async_queue_remaining{executor=~"durable|notification|observability"} == 0
          and on(executor) noviis_async_active > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Async executor {{ $labels.executor }} has no queue capacity remaining" }
      - alert: NoviIsShopStreamRelayFailure
        expr: >-
          increase(noviis_shop_stream_relay_publish_failures_total[5m]) > 0
          or increase(noviis_shop_stream_relay_receive_failures_total[5m]) > 0
        labels: { severity: warning }
        annotations: { summary: "Cross-instance shop status relay failed" }
      - alert: NoviIsWebPushDeliveryFailureHigh
        expr: >-
          sum(increase(noviis_webpush_delivery_total{outcome=~"timeout|retryable_failure|permanent_failure"}[15m]))
          / clamp_min(sum(increase(noviis_webpush_delivery_total[15m])), 1) > 0.10
          and sum(increase(noviis_webpush_delivery_total[15m])) >= 20
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Web Push failures exceeded 10 percent with at least 20 delivery attempts" }
      - alert: NoviIsWebPushCleanupFailure
        expr: increase(noviis_webpush_subscription_cleanup_total{outcome="failure"}[15m]) > 0
        labels: { severity: warning }
        annotations: { summary: "Expired Web Push subscription cleanup failed" }
      - alert: NoviIsWebPushJobBacklog
        expr: noviis_webpush_job_backlog{status="pending"} > 100 or noviis_webpush_job_oldest_age_seconds > 300
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Durable Web Push delivery is not keeping pace" }
      - alert: NoviIsWebPushJobFailed
        expr: noviis_webpush_job_backlog{status="failed"} > 0
        labels: { severity: critical }
        annotations: { summary: "A durable Web Push job exhausted all retries" }
      - alert: NoviIsWebPushJobDeadLetter
        expr: increase(noviis_webpush_job_outcome_total{outcome="dead_letter"}[15m]) > 0
        labels: { severity: critical }
        annotations: { summary: "A Web Push job entered the dead letter state" }
      - alert: NoviIsNotificationDeliveryBacklog
        expr: noviis_notification_delivery_jobs_pending > 100
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Durable notification delivery has more than 100 pending jobs" }
      - alert: NoviIsNotificationDeliveryDeadLetter
        expr: noviis_notification_delivery_jobs_dead_letter > 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "A durable notification delivery exhausted all retries" }
      - alert: NoviIsNotificationDeliveryOldestDueStale
        expr: noviis_notification_delivery_jobs_oldest_due_age_seconds > 300
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "The oldest due notification delivery has waited more than five minutes" }
      - alert: NoviIsNotificationDeliveryLeaseStale
        expr: noviis_notification_delivery_jobs_oldest_lease_age_seconds > 120
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "A notification delivery lease has remained active for more than two minutes" }
      - alert: NoviIsFeedGenerationBacklog
        expr: noviis_feed_generation_jobs_pending > 100
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Feed generation has more than 100 pending jobs" }
      - alert: NoviIsFeedGenerationOldestPendingStale
        expr: noviis_feed_generation_jobs_oldest_pending_age_seconds > 300
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "The oldest feed generation job has waited more than five minutes" }
      - alert: NoviIsFeedGenerationFailed
        expr: noviis_feed_generation_jobs_failed > 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "A feed generation job exhausted all retries" }
      - alert: NoviIsFeedGenerationDeadLetter
        expr: increase(noviis_feed_generation_jobs_processed_total{result="dead_letter"}[15m]) > 0
        labels: { severity: critical }
        annotations: { summary: "Feed generation moved a job to the dead letter state" }
      - alert: NoviIsKeywordFanoutStale
        expr: noviis_notification_keyword_fanout_jobs_oldest_due_age_seconds > 300
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "The oldest keyword notification fan-out has waited more than five minutes" }
      - alert: NoviIsKeywordFanoutDeadLetter
        expr: noviis_notification_keyword_fanout_jobs_dead_letter > 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "A keyword notification fan-out exhausted all retries" }
      - alert: NoviIsKeywordFanoutRetrySurge
        expr: increase(noviis_notification_keyword_fanout_jobs_total{outcome="retry"}[15m]) > 20
        labels: { severity: warning }
        annotations: { summary: "Keyword notification fan-out retries exceeded 20 in 15 minutes" }
      - alert: NoviIsFileVariantCleanupStale
        expr: noviis_file_variant_cleanup_oldest_due_age_seconds > 900
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "An image variant cleanup has remained due for more than 15 minutes" }
      - alert: NoviIsFileVariantCleanupDeadLetter
        expr: noviis_file_variant_cleanup_dead_letter > 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "An image variant cleanup exhausted all retries" }
      - alert: NoviIsFileVariantCleanupRetrySurge
        expr: increase(noviis_file_variant_cleanup_total{outcome="retry"}[15m]) > 20
        labels: { severity: warning }
        annotations: { summary: "Image variant cleanup retries exceeded 20 in 15 minutes" }
      - alert: NoviIsSemanticReindexStale
        expr: noviis_semantic_reindex_jobs_oldest_active_age_seconds > 900
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "A semantic reindex cursor job has remained active for more than 15 minutes" }
      - alert: NoviIsSemanticReindexFailed
        expr: noviis_semantic_reindex_jobs_failed > 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "A semantic reindex job exhausted all retries" }
      - alert: NoviIsSemanticReindexDeadLetter
        expr: increase(noviis_semantic_reindex_jobs_processed_total{result="dead_letter"}[15m]) > 0
        labels: { severity: critical }
        annotations: { summary: "Semantic reindexing moved a job to the dead letter state" }
      - alert: NoviIsProcessRestarted
        expr: changes(process_start_time_seconds{job="noviis-backend"}[15m]) > 0
        labels: { severity: info }
        annotations: { summary: "The NoviIs backend process restarted within the last 15 minutes" }
      - alert: NoviIsHostExporterDown
        expr: up{job="noviis-host",monitoring="enabled"} == 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "The enabled NoviIs host exporter is unavailable" }
      - alert: NoviIsHostTargetMissing
        expr: >-
          up{job="noviis-host-contract",monitoring="expected"} == 1
          unless on() up{job="noviis-host",monitoring="enabled"}
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Host monitoring is expected but the exporter target is missing" }
      - alert: NoviIsHostFilesystemMetricMissing
        expr: >-
          up{job="noviis-host",monitoring="enabled"} == 1
          unless on(instance) node_filesystem_avail_bytes{job="noviis-host",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "The host exporter is up but root filesystem metrics are missing" }
      - alert: NoviIsHostDiskFreeLow
        expr: >-
          node_filesystem_avail_bytes{job="noviis-host",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}
          / clamp_min(node_filesystem_size_bytes{job="noviis-host",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}, 1) < 0.15
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "The NoviIs host root filesystem has less than 15 percent free space" }
      - alert: NoviIsHostInodesFreeLow
        expr: >-
          node_filesystem_files_free{job="noviis-host",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}
          / clamp_min(node_filesystem_files{job="noviis-host",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}, 1) < 0.10
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "The NoviIs host root filesystem has less than 10 percent free inodes" }
      - alert: NoviIsHostDiskWillFillWithin24Hours
        expr: >-
          predict_linear(node_filesystem_avail_bytes{job="noviis-host",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}[6h], 86400) < 0
          and deriv(node_filesystem_avail_bytes{job="noviis-host",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}[1h]) < 0
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "The NoviIs host root filesystem is predicted to fill within 24 hours" }
      - alert: NoviIsDeploymentCleanupDebt
        expr: noviis_deployment_cleanup_debt == 1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Deployment cleanup debt remains for {{ $labels.component }}: {{ $labels.debt }}"
      - alert: NoviIsDeploymentCleanupMetricMissing
        expr: noviis_deployment_cleanup_expected unless on(component, debt) noviis_deployment_cleanup_writer_success_timestamp_seconds
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Deployment cleanup metrics are missing for {{ $labels.component }}: {{ $labels.debt }}"
      - alert: NoviIsDeploymentCleanupMetricStale
        expr: >-
          noviis_deployment_cleanup_debt == 1
          and on(component, debt) time() - noviis_deployment_cleanup_writer_success_timestamp_seconds > 1800
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Deployment cleanup metrics are stale for {{ $labels.component }}: {{ $labels.debt }}"
      - alert: NoviIsDeploymentIncomingOrphans
        expr: noviis_deployment_incoming_orphans > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Incoming release directories remain for {{ $labels.component }}"
      - alert: NoviIsDeploymentIncomingOrphanOld
        expr: noviis_deployment_incoming_orphan_oldest_age_seconds > 3600
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "The oldest incoming release for {{ $labels.component }} is over one hour old"
      - alert: NoviIsAgentPurgeBacklog
        expr: noviis_agent_pending_claim_purge_eligible > 5000
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "More than 5000 pending agent rows await purge" }
      - alert: NoviIsSensitiveRateLimitSurge
        expr: sum(increase(noviis_ratelimit_rejected_total{tier=~"auth|agent-register|public-log"}[5m])) > 20
        labels: { severity: warning }
        annotations: { summary: "Sensitive unauthenticated endpoints are being rate limited heavily" }
